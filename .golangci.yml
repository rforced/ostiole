version: "2"

run:
  timeout: 5m
  tests: true

linters:
  default: standard
  enable:
    - bodyclose
    - copyloopvar
    - errorlint
    - gocritic
    - gosec
    - misspell
    - noctx
    - nolintlint
    - revive
    - sloglint
    - unconvert
    - unparam
  exclusions:
    generated: lax
    # A JavaScript dependency that happens to ship Go source is not ours.
    paths:
      - web/node_modules
    presets:
      - std-error-handling
      - common-false-positives
    rules:
      - path: _test\.go
        linters:
          - bodyclose
          - gosec
          - noctx
      # Helper packages like s3test only ever run under go test.
      - path: internal/[a-z0-9]+/[a-z0-9]+test/
        linters:
          - bodyclose
          - gosec
          - noctx

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/rforced/ostiole
