name: Release

on:
  push:
    tags: ["v*"]

# Nothing at the workflow level: each job asks for what it needs, and
# anything added later starts from read-only.
permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Publishes a draft, which neither install.sh nor the updater sees.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # Nothing here reads a cache. A cache is writable by any run on
      # any branch, including a pull request from a fork, and this is
      # the one workflow whose output people install: a poisoned entry
      # would be signed and attested along with everything else.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
          no-cache: true
      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
      - name: Build the web UI
        working-directory: web
        run: bun install --frozen-lockfile && bun run build
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: v2.18.2
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # The UI build runs other people's JavaScript, and goreleaser and syft
  # are tools of their own. None of them runs here, where the signing key
  # and the identity that attests are: on a fresh runner, after the build
  # has finished, with the signer built by the Go toolchain alone.
  sign:
    name: Sign and publish
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      # Build provenance is signed through Sigstore with a short-lived
      # workflow identity, so nothing else has to hold a key.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Build the signer
        run: go build -trimpath -o "$RUNNER_TEMP/ostiole-sign" ./cmd/ostiole-sign
      - name: Fetch the checksums
        run: gh release download "$TAG" --pattern checksums.txt --dir dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
      # The key is in scope for this step alone.
      - name: Sign the checksums
        run: '"$RUNNER_TEMP/ostiole-sign" -in dist/checksums.txt -out dist/checksums.txt.sig'
        env:
          OSTIOLE_SIGNING_KEY: ${{ secrets.OSTIOLE_SIGNING_KEY }}
      # Every artifact checksums.txt names, by its digest there, and the
      # file itself.
      - name: Attest the artifacts
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/checksums.txt
      - name: Attest the checksums
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/checksums.txt
      - name: Publish the release
        run: |
          gh release upload "$TAG" dist/checksums.txt.sig
          gh release edit "$TAG" --draft=false
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
