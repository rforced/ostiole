name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run format:check
      - run: bun run test
      - run: bun run build
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: internal/web/dist
          include-hidden-files: true
          if-no-files-found: error

  go:
    name: Go
    runs-on: ubuntu-latest
    needs: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: internal/web/dist
      - uses: golangci/golangci-lint-action@v8
        with:
          version: latest
      - run: go vet ./...
      - run: go test -race -cover ./...
      - name: Build
        env:
          CGO_ENABLED: '0'
        run: go build -trimpath -ldflags '-s -w' -o bin/ostiole ./cmd/ostiole
      - name: Smoke test
        run: |
          ./bin/ostiole version
          ./bin/ostiole serve --listen 127.0.0.1:18080 &
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:18080/api/v1/health && break; sleep 0.5; done
          curl -fsS http://127.0.0.1:18080/ | grep -q '<div id="app">'
          kill %1
      - uses: actions/upload-artifact@v4
        with:
          name: ostiole-linux-amd64
          path: bin/ostiole
