name: CI

on:
  push:
    branches: [dev]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run format:check
      - run: bun run test
      - run: bun run build
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: internal/web/dist
          include-hidden-files: true
          if-no-files-found: error

  go:
    name: Go
    runs-on: ubuntu-latest
    needs: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: internal/web/dist
      - uses: golangci/golangci-lint-action@v8
        with:
          version: latest
      - run: go vet ./...
      - run: go test -race -cover ./...
      - name: Build
        env:
          CGO_ENABLED: '0'
        run: go build -trimpath -ldflags '-s -w' -o bin/ostiole ./cmd/ostiole
      - name: Smoke test
        run: |
          ./bin/ostiole version
          ./bin/ostiole serve --listen 127.0.0.1:18080 &
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:18080/api/v1/health && break; sleep 0.5; done
          curl -fsS http://127.0.0.1:18080/ | grep -q '<div id="app">'
          kill %1
      - uses: actions/upload-artifact@v4
        with:
          name: ostiole-linux-amd64
          path: bin/ostiole

  e2e:
    name: Browser
    runs-on: ubuntu-latest
    needs: go
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ostiole-linux-amd64
          path: bin
      - run: chmod +x ../bin/ostiole
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - run: bun run e2e
        env:
          OSTIOLE_BIN: ../bin/ostiole
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: web/playwright-report
          retention-days: 7

  packages:
    name: Packages (${{ matrix.image }})
    runs-on: ubuntu-latest
    needs: web
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: debian:12
            install: apt-get update -qq && apt-get install -y -qq ./dist/*_linux_amd64.deb
          - image: ubuntu:24.04
            install: apt-get update -qq && apt-get install -y -qq ./dist/*_linux_amd64.deb
          - image: fedora:42
            install: dnf install -y -q ./dist/*_linux_amd64.rpm
          - image: rockylinux/rockylinux:10
            install: dnf install -y -q ./dist/*_linux_amd64.rpm
          - image: alpine:3.21
            install: apk add --allow-untrusted ./dist/*_linux_amd64.apk
          - image: archlinux:latest
            install: pacman -Sy --noconfirm && pacman -U --noconfirm ./dist/*_linux_amd64.pkg.tar.zst
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: internal/web/dist
      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --snapshot --clean --skip=sign,publish,sbom,before
      - name: Install the package and run the binary
        run: |
          docker run --rm -v "$PWD/dist:/dist" -v "$PWD/internal/nft/testdata:/testdata:ro" -w / ${{ matrix.image }} sh -c '
            set -e
            ${{ matrix.install }}
            ostiole version
            ostiole render --file /testdata/full.json | head -3
            ostiole check --file /testdata/full.json --nft /bin/true 2>&1 | head -1 || true
          '
