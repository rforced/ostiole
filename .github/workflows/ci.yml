name: CI

on:
  push:
    branches: [dev]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # What Browser and Snapshot build wait for, and only that: the web UI
  # and the binary it is embedded in. The checks run beside this, not in
  # front of it.
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
        working-directory: web
      - run: bun run build
        working-directory: web
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: web-dist
          path: internal/web/dist
          include-hidden-files: true
          if-no-files-found: error
      # Not cached: it is one small build.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Build
        env:
          CGO_ENABLED: '0'
        run: go build -trimpath -ldflags '-s -w' -o bin/ostiole ./cmd/ostiole
      # A throwaway config directory, so this never reaches /etc/ostiole,
      # and a wait that fails loudly: a curl on the left of && is exempt
      # from set -e, so an exhausted loop would otherwise fall through to
      # the next line and fail there with nothing to read.
      - name: Smoke test
        run: |
          ./bin/ostiole version
          dir="$(mktemp -d)"
          ./bin/ostiole --config-dir "$dir" serve --listen 127.0.0.1:18080 &
          ready=
          for _ in $(seq 1 20); do
            if curl -fs http://127.0.0.1:18080/api/v1/health; then ready=1; break; fi
            sleep 0.5
          done
          [ -n "$ready" ] || { echo "the server never came up"; exit 1; }
          curl -fsS http://127.0.0.1:18080/ | grep -q '<div id="app">'
          kill %1
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ostiole-linux-amd64
          path: bin/ostiole

  web:
    name: Web
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run format:check
      # The QR code test reads back what the encoder drew with zbarimg, a
      # decoder written by someone else. TESTENV_REQUIRE fails it rather
      # than skipping it when zbarimg is missing.
      - name: Give the tests what they need
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends zbar-tools
      - run: bun run test
        env:
          TESTENV_REQUIRE: '1'

  go:
    name: Go
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      # This job's own Go cache, saved once for each go.mod and go.sum by
      # the first run that passes. setup-go's is one key for every job
      # that uses it, and only the first to finish saves it: this job got
      # what the ACME tests built and compiled the rest from nothing.
      - id: go-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ci-go-${{ runner.os }}-${{ hashFiles('go.mod', 'go.sum') }}
      # Go deletes build cache entries it has not used for five days, and
      # a restored cache keeps the times it was saved with: without this,
      # the first build empties most of a cache saved more than five days
      # ago.
      - name: Mark the restored cache as used
        if: steps.go-cache.outputs.cache-hit == 'true'
        run: find ~/.cache/go-build -type f -exec touch {} +
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.14.0
      - run: go vet ./...
      - run: scripts/ci/check-imports.sh
      # What the tests need from the runner. The kernel tests run in an
      # unprivileged user and network namespace, which Ubuntu's AppArmor
      # refuses unless told otherwise. dnsmasq-base is dnsmasq without a
      # service to start. Shaping needs the ifb and CAKE modules, and the
      # WireGuard status test the wireguard one. The chronyd test starts
      # one, which Ubuntu's profile keeps out of a temporary directory. The
      # sidecar validates the proxy's rendered configuration.
      # TESTENV_REQUIRE fails a test the runner cannot run instead of
      # skipping it.
      - name: Give the tests what they need
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          unshare -Urn true
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends dnsmasq-base
          if ! sudo modprobe -a ifb sch_cake wireguard; then
            sudo apt-get install -y -qq "linux-modules-extra-$(uname -r)"
            sudo modprobe -a ifb sch_cake wireguard
          fi
          if [ -e /etc/apparmor.d/usr.sbin.chronyd ]; then
            sudo apparmor_parser -R /etc/apparmor.d/usr.sbin.chronyd
          fi
          CGO_ENABLED=0 go build -trimpath -o bin/ostiole-proxy ./cmd/ostiole-proxy
      # -count=1 runs every test every time, rather than reporting a
      # stored result for a package that has not changed.
      - run: go test -race -cover -count=1 ./...
        env:
          TESTENV_REQUIRE: '1'

  e2e:
    name: Browser
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 20
    permissions:
      contents: read
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ostiole-linux-amd64
          path: bin
      - run: chmod +x ../bin/ostiole
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - name: Give the tests what they need
        run: |
          sudo ip link add spare0 type dummy
          sudo ip link set spare0 up
      - run: bun run e2e
        env:
          OSTIOLE_BIN: ../bin/ostiole
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: playwright-report
          path: web/playwright-report
          retention-days: 7

  # Issuance is tested against pebble, Let's Encrypt's test CA, rather
  # than against a mock of it: the parts that go wrong are the ones only
  # a real ACME server exercises.
  acme:
    name: Certificates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - run: scripts/ci/acme-test.sh

  # The test systems are listed once, in .github/test-systems.json, and
  # read from there into the matrix below. Adding or dropping one is an
  # edit to that file and nothing else.
  targets:
    name: Test systems
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      images: ${{ steps.read.outputs.images }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: read
        run: echo "images=$(jq -c . .github/test-systems.json)" >> "$GITHUB_OUTPUT"

  # One snapshot build, used by every test system below. It used to be
  # built once per system, which was the same six builds of the same
  # commit.
  dist:
    name: Snapshot build
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      # The build cache is kept here and not in the release workflow.
      # goreleaser is what publishes there, which is why zizmor asks
      # about it; here it builds a snapshot that is skipped, thrown at
      # six containers, and deleted. Nobody installs this. It is this
      # job's own for the reasons in the Go job.
      - id: go-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # zizmor: ignore[cache-poisoning] v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ci-dist-${{ runner.os }}-${{ hashFiles('go.mod', 'go.sum') }}
      # See the Go job.
      - name: Mark the restored cache as used
        if: steps.go-cache.outputs.cache-hit == 'true'
        run: find ~/.cache/go-build -type f -exec touch {} +
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: web-dist
          path: internal/web/dist
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: v2.18.2
          args: release --snapshot --clean --skip=sign,publish,sbom,before
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: snapshot-dist
          if-no-files-found: error
          path: |
            dist/*.tar.gz
            dist/checksums.txt

  # Everything that has to be true on a real distribution: the install
  # script behaves against a build it has never seen, and a whole
  # `ostiole install` does what it printed.
  systems:
    name: ${{ matrix.image }}
    runs-on: ubuntu-latest
    needs: [dist, targets]
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.targets.outputs.images) }}
    env:
      IMAGE: ${{ matrix.image }}
      PORT: '18099'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: snapshot-dist
          path: dist

      - name: Serve the build the way a release is served
        run: |
          version=$(scripts/ci/serve-tree.sh dist /tmp/serve)
          echo "VERSION=$version" >> "$GITHUB_ENV"
          # Detached, with its output on a file: a background process
          # still holding the step's stdout is a step that never ends.
          python3 -m http.server "$PORT" --bind 0.0.0.0 --directory /tmp/serve \
            >/tmp/serve.log 2>&1 &
          disown
          for _ in $(seq 1 20); do
            curl -fsS "http://127.0.0.1:$PORT/install.sh" >/dev/null 2>&1 && break
            sleep 0.5
          done
          # Insisted on, not hoped for: the tests below are only worth
          # anything if there is something behind this address.
          curl -fsS "http://127.0.0.1:$PORT/install.sh" >/dev/null

      - name: The install script
        run: |
          docker run --rm --add-host=host.test:host-gateway \
            -v "$PWD/scripts/ci:/ci:ro" \
            -v "$PWD/internal/nft/testdata:/testdata:ro" \
            "$IMAGE" sh /ci/install-script-test.sh "http://host.test:$PORT" "$VERSION"

      - name: A real install, under systemd
        run: scripts/ci/run-systemd-test.sh "$IMAGE" "http://host.test:$PORT" "$VERSION"
