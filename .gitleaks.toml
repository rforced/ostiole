[extend]
useDefault = true

[allowlist]
description = "Keys that are published, or made up for a fixture"
regexTarget = "line"
regexes = [
  # RFC 6238's test secret ("12345678901234567890" in base32), which the
  # TOTP tests use.
  '''GEZDGNBVGY3TQOJQGEZDGNBVGY3TQOJQ''',
  # The wg(8) man page's example keypair and preshared key, which the
  # WireGuard fixtures use.
  '''yAnz5TF\+lXXJte14tji3zlMNq\+hd2rYUIgJBgB3fBmk=''',
  '''FpCyhws9cxwWoV4xELtfJvjJN\+zQVRPISllRWgeopVE=''',
  # A counting pattern standing in for a WireGuard key in a server test.
  '''AAECAwQFBgcICQoLDA0ODxAREhMUFRYXGBkaGxwdHh8=''',
  # The TSIG test secret, base64 for "ostiole-tsig-test-secret-32bytes".
  # A captured nsupdate message is signed with it, so it stays fixed.
  '''b3N0aW9sZS10c2lnLXRlc3Qtc2VjcmV0LTMyYnl0ZXM=''',
  # The made-up JSON web token the WAF redaction tests look for:
  # {"alg":"none"}, {"sub":"x"} and "signature".
  '''eyJhbGciOiJub25lIn0\.eyJzdWIiOiJ4In0\.c2lnbmF0dXJl''',
  # The public half of the release signing key, which the installer, the
  # release notes and SECURITY.md all print on purpose. Written as the
  # ed25519 public key prefix so a rotation does not come back here.
  '''MCowBQYDK2Vw[A-Za-z0-9+/]+=*''',
  # The OpenVPN fixtures' made-up PEM bodies: base64 for "lab client key"
  # (the Go fixture and golden) and "MADE-UP-client-key" (the web specs),
  # and the counting hex standing in for a tls-crypt key.
  '''bGFiIGNsaWVudCBrZXk=''',
  '''TUFERS1VUC1jbGllbnQta2V5''',
  '''00112233445566778899aabbccddeeff''',
  # The made-up MaxMind licence keys in the feeds tests and the Fetched
  # aliases spec, each built around the counting run 0123456789.
  '''[A-Za-z]*0123456789[A-Za-z_]*''',
]
# The rendered OpenVPN golden carries the same made-up key over several
# lines, where a line regex cannot see the body.
paths = [
  '''internal/services/testdata/openvpn\.openvpn''',
]
