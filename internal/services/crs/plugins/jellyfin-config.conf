# Ostiole's Jellyfin rule exclusions, 1.4.0. Rules are in
# jellyfin-before.conf.
#
# Rule ID block: 21,000 - 21,999
#
# On unless tx.jellyfin-rule-exclusions-plugin_enabled is set to 0 first.
SecRule &TX:jellyfin-rule-exclusions-plugin_enabled "@eq 0" \
    "id:21010,\
    phase:1,\
    pass,\
    nolog,\
    ver:'jellyfin-rule-exclusions/1.4.0',\
    setvar:'tx.jellyfin-rule-exclusions-plugin_enabled=1'"
