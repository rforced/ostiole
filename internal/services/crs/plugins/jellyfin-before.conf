# Ostiole's Jellyfin rule exclusions, 1.6.0.
#
# Rule ID block: 21,000 - 21,999
#
# What Jellyfin's clients send scores nothing at paranoia 1 to 4, and
# everything else is read as CRS reads it. The clients send ids, numbers,
# codec and field lists, times, media types and the web client's saved
# sorting, whose dashes, bars, colons and quotes the rules that count
# special characters refuse from paranoia 2. Those rules skip the arguments
# only while every argument holds one of those shapes, none of which can
# carry an attack; one argument holding anything else and the whole request
# is read as usual. Text people type or that comes from the library or a
# metadata provider, a search, a name to filter by, a playlist's name or a
# device's, a picture's address, is read as at paranoia 2, whose attack
# rules all still read it, and a plot summary Identify sends back as at
# paranoia 1. A password is not read at all, as in CRS's own WordPress set,
# and neither is a picture, subtitle or lyrics file uploaded. The rules
# named are the ones CRS 4.29 tripped on the clients' requests, captured
# from a server in use and read from the Roku client's source, and on the
# names of that server's films, shows and people.
#
# Jellyfin is taken to be served at the root of its name. Not covered yet:
# the dashboard's settings pages, editing an item's metadata by hand, live
# TV setup, plugins and their pages.

# Turned off, the set takes its own rules out.
SecRule TX:jellyfin-rule-exclusions-plugin_enabled "@eq 0" \
    "id:21099,\
    phase:1,\
    pass,\
    nolog,\
    ver:'jellyfin-rule-exclusions/1.6.0',\
    ctl:ruleRemoveById=21100-21999"

# CRS sets its default methods (rule 901160) after the plugins run, so the
# default is set here first, for the API's own to be added to.
SecRule &TX:allowed_methods "@eq 0" \
    "id:21100,\
    phase:1,\
    pass,\
    nolog,\
    ver:'jellyfin-rule-exclusions/1.6.0',\
    setvar:'tx.allowed_methods=GET HEAD POST OPTIONS'"

# The API takes back a favourite, a played mark or a rating with DELETE.
SecRule REQUEST_FILENAME "!@beginsWith /web/" \
    "id:21101,\
    phase:1,\
    pass,\
    t:none,\
    nolog,\
    ver:'jellyfin-rule-exclusions/1.6.0',\
    setvar:'tx.allowed_methods=%{tx.allowed_methods} DELETE'"

# The web client's own settings, a file name CRS keeps from being read.
SecRule REQUEST_FILENAME "@streq /web/config.json" \
    "id:21110,\
    phase:1,\
    pass,\
    t:none,\
    nolog,\
    ver:'jellyfin-rule-exclusions/1.6.0',\
    ctl:ruleRemoveTargetById=930130;REQUEST_FILENAME"

# Players ask for streams and images without an Accept header, and seek
# with Range.
SecRule REQUEST_FILENAME "@rx (?i)^/(?:(?:videos|audio)/|userimage$|(?:items|users|artists|persons|genres|musicgenres|studios)/[^/]+/(?:images|download)(?:/|$))" \
    "id:21120,\
    phase:1,\
    pass,\
    t:none,\
    nolog,\
    ver:'jellyfin-rule-exclusions/1.6.0',\
    ctl:ruleRemoveById=920300,\
    ctl:ruleRemoveById=921230"

# The clients' Authorization header names the client, the device and its
# id, and the device's name is free text, "Sam's TV (2)" or "Büro" say,
# which the byte range checks on headers refuse. Only while the header,
# decoded as those checks decode it, has that form and no markup, since the
# dashboard lists devices by name.
SecRule REQUEST_HEADERS:Authorization "@rx ^(?:MediaBrowser|Emby) [A-Za-z]+=\"[^\"<>`\\\\{}]*\"(?:, ?[A-Za-z]+=\"[^\"<>`\\\\{}]*\")*$" \
    "id:21130,\
    phase:1,\
    pass,\
    t:none,t:urlDecodeUni,\
    nolog,\
    ver:'jellyfin-rule-exclusions/1.6.0',\
    ctl:ruleRemoveTargetById=920272;REQUEST_HEADERS:Authorization,\
    ctl:ruleRemoveTargetById=920274;REQUEST_HEADERS:Authorization"

SecRule REQUEST_HEADERS:X-Emby-Authorization "@rx ^(?:MediaBrowser|Emby) [A-Za-z]+=\"[^\"<>`\\\\{}]*\"(?:, ?[A-Za-z]+=\"[^\"<>`\\\\{}]*\")*$" \
    "id:21131,\
    phase:1,\
    pass,\
    t:none,t:urlDecodeUni,\
    nolog,\
    ver:'jellyfin-rule-exclusions/1.6.0',\
    ctl:ruleRemoveTargetById=920272;REQUEST_HEADERS:X-Emby-Authorization,\
    ctl:ruleRemoveTargetById=920274;REQUEST_HEADERS:X-Emby-Authorization"

# The Roku player's CMCD header names the next segment, query and all.
SecRule REQUEST_HEADERS:Cmcd-Request "@rx ^[a-z]+(?:=(?:[0-9.]+|[a-z]+|\"[A-Za-z0-9._~/?&=%,+-]*\"))?(?:,[a-z]+(?:=(?:[0-9.]+|[a-z]+|\"[A-Za-z0-9._~/?&=%,+-]*\"))?)*$" \
    "id:21133,\
    phase:1,\
    pass,\
    t:none,\
    nolog,\
    ver:'jellyfin-rule-exclusions/1.6.0',\
    ctl:ruleRemoveTargetById=920274;REQUEST_HEADERS:Cmcd-Request"

# A client's name leads its User-Agent, and the check for Unix commands
# takes a name that begins with who or dnf for the command. It skips the
# header while the header holds none of the shell's operators, quotes or
# braces, without which no command can follow.
SecRule REQUEST_HEADERS:User-Agent "@rx ^[A-Za-z0-9 ._/+()-]*$" \
    "id:21132,\
    phase:1,\
    pass,\
    t:none,\
    nolog,\
    ver:'jellyfin-rule-exclusions/1.6.0',\
    ctl:ruleRemoveTargetById=932238;REQUEST_HEADERS:User-Agent"

# A client's log goes up as text, which is kept rather than read: read as a
# form, its lines are argument names that trip the injection rules.
SecRule REQUEST_FILENAME "@rx (?i)^/clientlog/document$" \
    "id:21140,\
    phase:1,\
    pass,\
    t:none,\
    nolog,\
    ver:'jellyfin-rule-exclusions/1.6.0',\
    ctl:requestBodyAccess=Off,\
    ctl:ruleRemoveById=920420"

# A picture goes up as its file in base64, typed as the image it is: an
# item's, a user's or the sign-in page's. It is kept as the picture, not
# read, as a file uploaded in a form is, and the profile's body limit does
# not apply, since a backdrop can be larger.
SecRule REQUEST_FILENAME "@rx (?i)^/(?:(?:items|users)/[0-9a-f-]{32,36}/images/[a-z]+(?:/[0-9]+)?|userimage|branding/splashscreen)$" \
    "id:21141,\
    phase:1,\
    pass,\
    t:none,\
    nolog,\
    ver:'jellyfin-rule-exclusions/1.6.0',\
    chain"
    SecRule REQUEST_METHOD "@streq POST" \
        "t:none,\
        chain"
        SecRule REQUEST_HEADERS:Content-Type "@rx (?i)^image/[a-z0-9][a-z0-9.+-]*(?:\s*;.*)?$" \
            "t:none,\
            ctl:requestBodyAccess=Off,\
            ctl:ruleRemoveById=920420"

# A song's lyrics go up as the file's text, kept as the lyrics, not read, as
# a client's log is. The file's name is text.
SecRule REQUEST_FILENAME "@rx (?i)^/audio/[0-9a-f-]{32,36}/lyrics$" \
    "id:21142,\
    phase:1,\
    pass,\
    t:none,\
    nolog,\
    ver:'jellyfin-rule-exclusions/1.6.0',\
    chain"
    SecRule REQUEST_METHOD "@streq POST" \
        "t:none,\
        chain"
        SecRule REQUEST_HEADERS:Content-Type "@rx (?i)^text/plain(?:\s*;.*)?$" \
            "t:none,\
            ctl:requestBodyAccess=Off,\
            ctl:ruleRemoveById=920420"

# A subtitle goes up as JSON, the file in base64 in Data beside its
# language, format and flags. While Data is the only one and holds base64
# alone, it is kept as the subtitle, not read, and does not mark the
# request.
SecRule REQUEST_FILENAME "@rx (?i)^/videos/[0-9a-f-]{32,36}/subtitles$" \
    "id:21143,\
    phase:2,\
    pass,\
    t:none,\
    nolog,\
    ver:'jellyfin-rule-exclusions/1.6.0',\
    chain"
    SecRule REQUEST_METHOD "@streq POST" \
        "t:none,\
        chain"
        SecRule &ARGS:/(?i)^json\.data$/ "@eq 1" \
            "t:none,\
            chain"
            SecRule ARGS:/(?i)^json\.data$/ "@rx ^[A-Za-z0-9+/]+={0,2}$" \
                "t:none,\
                ctl:ruleRemoveTargetByTag=OWASP_CRS;ARGS:/(?i)^json\.data$/,\
                ctl:ruleRemoveTargetById=21151;ARGS:/(?i)^json\.data$/"

# A request with an argument, or an argument's name, of any shape but the
# clients' is marked. Text and passwords are left out: the rules below
# handle them. The Roku client puts a space after each comma of a list. A
# device profile's conditions list codec profiles, some with a space in,
# "constrained baseline" say; the device's names in a profile are text.
SecRule ARGS_NAMES "!@rx ^[A-Za-z0-9_.-]+$" \
    "id:21150,\
    phase:2,\
    pass,\
    t:none,\
    nolog,\
    ver:'jellyfin-rule-exclusions/1.6.0',\
    setvar:'tx.jellyfin-rule-exclusions-plugin_other_shape=1'"

SecRule ARGS|!ARGS:/(?i)^json\.deviceprofile\./|!ARGS:/(?i)^(?:searchterm|namestartswith|namestartswithorgreater|namelessthan|person|name|genres|studios|tags|excludetags|officialratings|artists|albums|providername|imageurl|json\.name|json\.username|json\.groupname|json\.searchinfo\.name|json\.searchprovidername|json\.imageurl|json\.overview|json\.(?:albumartist|artists\.[0-9]+)\.(?:name|overview|searchprovidername)|filename|json\.pw|json\.currentpw|json\.newpw)$/ "!@rx ^(?:[A-Za-z0-9_.-]+(?:(?:, ?|[|])[A-Za-z0-9_.-]+)*|[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(?:\.[0-9]{1,7})?(?:Z|[+-][0-9]{2}:[0-9]{2})?|\{(?:\"[A-Za-z0-9_]+\":(?:\"[A-Za-z0-9_.,|-]*\"|[A-Za-z0-9_.-]+),?)*\})?$" \
    "id:21151,\
    phase:2,\
    pass,\
    t:none,\
    nolog,\
    ver:'jellyfin-rule-exclusions/1.6.0',\
    setvar:'tx.jellyfin-rule-exclusions-plugin_other_shape=1'"

SecRule ARGS:/(?i)^json\.deviceprofile\./|!ARGS:/(?i)^json\.deviceprofile\.(?:identification\.)?(?:friendlyname|manufacturer|modelname|modeldescription|modelnumber|serialnumber)$/ "!@rx ^(?:[A-Za-z0-9_.-]+(?: [A-Za-z0-9_.-]+)*(?:[,|][A-Za-z0-9_.-]+(?: [A-Za-z0-9_.-]+)*)*|[a-z]+/[a-z0-9.+-]+)?$" \
    "id:21152,\
    phase:2,\
    pass,\
    t:none,\
    nolog,\
    ver:'jellyfin-rule-exclusions/1.6.0',\
    setvar:'tx.jellyfin-rule-exclusions-plugin_other_shape=1'"

# With none marked, the rules that count special characters skip the
# arguments and their names, and repeated names, which is how the clients
# send a list, are not taken for parameter pollution. Text in the query
# string is in the raw URI too, where the check for what is not ASCII reads
# it again. The web client's saved sorting, JSON in a string, reads as
# quoted SQL to two more rules, and its settings' id is named like the id
# command. A word that begins with who or dnf, a client's name as it saves
# its settings, is taken for the command.
SecRule &TX:jellyfin-rule-exclusions-plugin_other_shape "@eq 0" \
    "id:21153,\
    phase:2,\
    pass,\
    t:none,\
    nolog,\
    ver:'jellyfin-rule-exclusions/1.6.0',\
    ctl:ruleRemoveTargetById=920272;REQUEST_URI_RAW,\
    ctl:ruleRemoveTargetById=932238;ARGS,\
    ctl:ruleRemoveTargetById=920273;ARGS,\
    ctl:ruleRemoveTargetById=920273;ARGS_NAMES,\
    ctl:ruleRemoveTargetById=942430;ARGS,\
    ctl:ruleRemoveTargetById=942430;ARGS_NAMES,\
    ctl:ruleRemoveTargetById=942431;ARGS,\
    ctl:ruleRemoveTargetById=942431;ARGS_NAMES,\
    ctl:ruleRemoveTargetById=942432;ARGS,\
    ctl:ruleRemoveTargetById=942432;ARGS_NAMES,\
    ctl:ruleRemoveTargetById=942460;ARGS,\
    ctl:ruleRemoveTargetById=932350;ARGS_NAMES:json.id,\
    ctl:ruleRemoveTargetById=942200;ARGS:/(?i)^json\.customprefs\./,\
    ctl:ruleRemoveTargetById=942340;ARGS:/(?i)^json\.customprefs\./,\
    ctl:ruleRemoveById=921180"

# Text: a search, a name to filter by, a user's, a playlist's or a group's
# name, a device's names in its profile ("Type: TV" for its kind), a
# metadata provider's name and the address of a picture it offers, which
# for a studio's picture holds the studio's name as it is, in any
# language, the plot summary and the artists of a match Identify sends
# back, and a lyrics file's name. It is read as at paranoia 2: the rules
# that count characters or refuse what is not ASCII skip it, and so do the
# paranoia 3 rules real titles trip, "!!" read as the shell's history or a
# quoted word as a tick. Every paranoia 1 and 2 rule still reads it.
SecAction \
    "id:21160,\
    phase:1,\
    pass,\
    nolog,\
    ver:'jellyfin-rule-exclusions/1.6.0',\
    ctl:ruleRemoveTargetById=920272;ARGS:/(?i)^(?:searchterm|namestartswith|namestartswithorgreater|namelessthan|person|name|genres|studios|tags|excludetags|officialratings|artists|albums|providername|imageurl|json\.name|json\.username|json\.groupname|json\.searchinfo\.name|json\.searchprovidername|json\.imageurl|json\.overview|json\.(?:albumartist|artists\.[0-9]+)\.(?:name|overview|searchprovidername)|filename|json\.deviceprofile\.(?:identification\.)?(?:friendlyname|manufacturer|modelname|modeldescription|modelnumber|serialnumber))$/,\
    ctl:ruleRemoveTargetById=920273;ARGS:/(?i)^(?:searchterm|namestartswith|namestartswithorgreater|namelessthan|person|name|genres|studios|tags|excludetags|officialratings|artists|albums|providername|imageurl|json\.name|json\.username|json\.groupname|json\.searchinfo\.name|json\.searchprovidername|json\.imageurl|json\.overview|json\.(?:albumartist|artists\.[0-9]+)\.(?:name|overview|searchprovidername)|filename|json\.deviceprofile\.(?:identification\.)?(?:friendlyname|manufacturer|modelname|modeldescription|modelnumber|serialnumber))$/,\
    ctl:ruleRemoveTargetById=942430;ARGS:/(?i)^(?:searchterm|namestartswith|namestartswithorgreater|namelessthan|person|name|genres|studios|tags|excludetags|officialratings|artists|albums|providername|imageurl|json\.name|json\.username|json\.groupname|json\.searchinfo\.name|json\.searchprovidername|json\.imageurl|json\.overview|json\.(?:albumartist|artists\.[0-9]+)\.(?:name|overview|searchprovidername)|filename|json\.deviceprofile\.(?:identification\.)?(?:friendlyname|manufacturer|modelname|modeldescription|modelnumber|serialnumber))$/,\
    ctl:ruleRemoveTargetById=942431;ARGS:/(?i)^(?:searchterm|namestartswith|namestartswithorgreater|namelessthan|person|name|genres|studios|tags|excludetags|officialratings|artists|albums|providername|imageurl|json\.name|json\.username|json\.groupname|json\.searchinfo\.name|json\.searchprovidername|json\.imageurl|json\.overview|json\.(?:albumartist|artists\.[0-9]+)\.(?:name|overview|searchprovidername)|filename|json\.deviceprofile\.(?:identification\.)?(?:friendlyname|manufacturer|modelname|modeldescription|modelnumber|serialnumber))$/,\
    ctl:ruleRemoveTargetById=942432;ARGS:/(?i)^(?:searchterm|namestartswith|namestartswithorgreater|namelessthan|person|name|genres|studios|tags|excludetags|officialratings|artists|albums|providername|imageurl|json\.name|json\.username|json\.groupname|json\.searchinfo\.name|json\.searchprovidername|json\.imageurl|json\.overview|json\.(?:albumartist|artists\.[0-9]+)\.(?:name|overview|searchprovidername)|filename|json\.deviceprofile\.(?:identification\.)?(?:friendlyname|manufacturer|modelname|modeldescription|modelnumber|serialnumber))$/,\
    ctl:ruleRemoveTargetById=942460;ARGS:/(?i)^(?:searchterm|namestartswith|namestartswithorgreater|namelessthan|person|name|genres|studios|tags|excludetags|officialratings|artists|albums|providername|imageurl|json\.name|json\.username|json\.groupname|json\.searchinfo\.name|json\.searchprovidername|json\.imageurl|json\.overview|json\.(?:albumartist|artists\.[0-9]+)\.(?:name|overview|searchprovidername)|filename|json\.deviceprofile\.(?:identification\.)?(?:friendlyname|manufacturer|modelname|modeldescription|modelnumber|serialnumber))$/,\
    ctl:ruleRemoveTargetById=932238;ARGS:/(?i)^(?:searchterm|namestartswith|namestartswithorgreater|namelessthan|person|name|genres|studios|tags|excludetags|officialratings|artists|albums|providername|imageurl|json\.name|json\.username|json\.groupname|json\.searchinfo\.name|json\.searchprovidername|json\.imageurl|json\.overview|json\.(?:albumartist|artists\.[0-9]+)\.(?:name|overview|searchprovidername)|filename|json\.deviceprofile\.(?:identification\.)?(?:friendlyname|manufacturer|modelname|modeldescription|modelnumber|serialnumber))$/,\
    ctl:ruleRemoveTargetById=932290;ARGS:/(?i)^(?:searchterm|namestartswith|namestartswithorgreater|namelessthan|person|name|genres|studios|tags|excludetags|officialratings|artists|albums|providername|imageurl|json\.name|json\.username|json\.groupname|json\.searchinfo\.name|json\.searchprovidername|json\.imageurl|json\.overview|json\.(?:albumartist|artists\.[0-9]+)\.(?:name|overview|searchprovidername)|filename|json\.deviceprofile\.(?:identification\.)?(?:friendlyname|manufacturer|modelname|modeldescription|modelnumber|serialnumber))$/,\
    ctl:ruleRemoveTargetById=932331;ARGS:/(?i)^(?:searchterm|namestartswith|namestartswithorgreater|namelessthan|person|name|genres|studios|tags|excludetags|officialratings|artists|albums|providername|imageurl|json\.name|json\.username|json\.groupname|json\.searchinfo\.name|json\.searchprovidername|json\.imageurl|json\.overview|json\.(?:albumartist|artists\.[0-9]+)\.(?:name|overview|searchprovidername)|filename|json\.deviceprofile\.(?:identification\.)?(?:friendlyname|manufacturer|modelname|modeldescription|modelnumber|serialnumber))$/,\
    ctl:ruleRemoveTargetById=932350;ARGS:/(?i)^(?:searchterm|namestartswith|namestartswithorgreater|namelessthan|person|name|genres|studios|tags|excludetags|officialratings|artists|albums|providername|imageurl|json\.name|json\.username|json\.groupname|json\.searchinfo\.name|json\.searchprovidername|json\.imageurl|json\.overview|json\.(?:albumartist|artists\.[0-9]+)\.(?:name|overview|searchprovidername)|filename|json\.deviceprofile\.(?:identification\.)?(?:friendlyname|manufacturer|modelname|modeldescription|modelnumber|serialnumber))$/,\
    ctl:ruleRemoveTargetById=933161;ARGS:/(?i)^(?:searchterm|namestartswith|namestartswithorgreater|namelessthan|person|name|genres|studios|tags|excludetags|officialratings|artists|albums|providername|imageurl|json\.name|json\.username|json\.groupname|json\.searchinfo\.name|json\.searchprovidername|json\.imageurl|json\.overview|json\.(?:albumartist|artists\.[0-9]+)\.(?:name|overview|searchprovidername)|filename|json\.deviceprofile\.(?:identification\.)?(?:friendlyname|manufacturer|modelname|modeldescription|modelnumber|serialnumber))$/,\
    ctl:ruleRemoveTargetById=933211;ARGS:/(?i)^(?:searchterm|namestartswith|namestartswithorgreater|namelessthan|person|name|genres|studios|tags|excludetags|officialratings|artists|albums|providername|imageurl|json\.name|json\.username|json\.groupname|json\.searchinfo\.name|json\.searchprovidername|json\.imageurl|json\.overview|json\.(?:albumartist|artists\.[0-9]+)\.(?:name|overview|searchprovidername)|filename|json\.deviceprofile\.(?:identification\.)?(?:friendlyname|manufacturer|modelname|modeldescription|modelnumber|serialnumber))$/,\
    ctl:ruleRemoveTargetById=942251;ARGS:/(?i)^(?:searchterm|namestartswith|namestartswithorgreater|namelessthan|person|name|genres|studios|tags|excludetags|officialratings|artists|albums|providername|imageurl|json\.name|json\.username|json\.groupname|json\.searchinfo\.name|json\.searchprovidername|json\.imageurl|json\.overview|json\.(?:albumartist|artists\.[0-9]+)\.(?:name|overview|searchprovidername)|filename|json\.deviceprofile\.(?:identification\.)?(?:friendlyname|manufacturer|modelname|modeldescription|modelnumber|serialnumber))$/,\
    ctl:ruleRemoveTargetById=942511;ARGS:/(?i)^(?:searchterm|namestartswith|namestartswithorgreater|namelessthan|person|name|genres|studios|tags|excludetags|officialratings|artists|albums|providername|imageurl|json\.name|json\.username|json\.groupname|json\.searchinfo\.name|json\.searchprovidername|json\.imageurl|json\.overview|json\.(?:albumartist|artists\.[0-9]+)\.(?:name|overview|searchprovidername)|filename|json\.deviceprofile\.(?:identification\.)?(?:friendlyname|manufacturer|modelname|modeldescription|modelnumber|serialnumber))$/"

# A password is whatever its owner chose, and Jellyfin only hashes it.
SecRule REQUEST_FILENAME "@rx (?i)^/users/(?:authenticatebyname|password|[0-9a-f-]{32,36}/password)$" \
    "id:21170,\
    phase:1,\
    pass,\
    t:none,\
    nolog,\
    ver:'jellyfin-rule-exclusions/1.6.0',\
    ctl:ruleRemoveTargetByTag=OWASP_CRS;ARGS:/(?i)^json\.(?:pw|currentpw|newpw)$/"

# Taking a picture a metadata provider offers, or identifying an item by a
# match one found, sends the picture's address, on the provider's own site.
# The check for links off the site skips it while it is the only address
# and a web one, on a host with a name.
SecRule REQUEST_FILENAME "@rx (?i)^/items/(?:remotesearch/apply/[0-9a-f-]{32,36}|[0-9a-f-]{32,36}/remoteimages/download)$" \
    "id:21180,\
    phase:2,\
    pass,\
    t:none,\
    nolog,\
    ver:'jellyfin-rule-exclusions/1.6.0',\
    chain"
    SecRule &ARGS:/(?i)^(?:json\.)?imageurl$/ "@eq 1" \
        "t:none,\
        chain"
        SecRule ARGS:/(?i)^(?:json\.)?imageurl$/ "@rx ^https?://[A-Za-z0-9-]+(?:\.[A-Za-z0-9-]+)+(?::[0-9]+)?/" \
            "t:none,\
            ctl:ruleRemoveTargetById=931130;ARGS:/(?i)^(?:json\.)?imageurl$/"

# The match Identify sends back carries the provider's plot summary or a
# person's life: prose, whose commas, quotes and words the SQL and command
# rules from paranoia 2 took for attacks in up to two summaries in five. On
# Identify's path a summary is read as at paranoia 1: the paranoia 2 and 3
# rules that summaries in eight languages tripped skip it. Every paranoia 1
# rule still reads it.
SecRule REQUEST_FILENAME "@rx (?i)^/items/remotesearch/apply/[0-9a-f-]{32,36}$" \
    "id:21181,\
    phase:1,\
    pass,\
    t:none,\
    nolog,\
    ver:'jellyfin-rule-exclusions/1.6.0',\
    ctl:ruleRemoveTargetById=931130;ARGS:/(?i)^json\.(?:(?:albumartist|artists\.[0-9]+)\.)?overview$/,\
    ctl:ruleRemoveTargetById=932190;ARGS:/(?i)^json\.(?:(?:albumartist|artists\.[0-9]+)\.)?overview$/,\
    ctl:ruleRemoveTargetById=932200;ARGS:/(?i)^json\.(?:(?:albumartist|artists\.[0-9]+)\.)?overview$/,\
    ctl:ruleRemoveTargetById=932231;ARGS:/(?i)^json\.(?:(?:albumartist|artists\.[0-9]+)\.)?overview$/,\
    ctl:ruleRemoveTargetById=932232;ARGS:/(?i)^json\.(?:(?:albumartist|artists\.[0-9]+)\.)?overview$/,\
    ctl:ruleRemoveTargetById=932236;ARGS:/(?i)^json\.(?:(?:albumartist|artists\.[0-9]+)\.)?overview$/,\
    ctl:ruleRemoveTargetById=932240;ARGS:/(?i)^json\.(?:(?:albumartist|artists\.[0-9]+)\.)?overview$/,\
    ctl:ruleRemoveTargetById=932271;ARGS:/(?i)^json\.(?:(?:albumartist|artists\.[0-9]+)\.)?overview$/,\
    ctl:ruleRemoveTargetById=932371;ARGS:/(?i)^json\.(?:(?:albumartist|artists\.[0-9]+)\.)?overview$/,\
    ctl:ruleRemoveTargetById=934101;ARGS:/(?i)^json\.(?:(?:albumartist|artists\.[0-9]+)\.)?overview$/,\
    ctl:ruleRemoveTargetById=941150;ARGS:/(?i)^json\.(?:(?:albumartist|artists\.[0-9]+)\.)?overview$/,\
    ctl:ruleRemoveTargetById=941320;ARGS:/(?i)^json\.(?:(?:albumartist|artists\.[0-9]+)\.)?overview$/,\
