# Ostiole's Jellyfin rule exclusions, 1.4.0.
#
# Rule ID block: 21,000 - 21,999
#
# What Jellyfin's clients send scores nothing at paranoia 1 to 4, and
# everything else is read as CRS reads it. The clients send ids, numbers,
# codec and field lists, times, media types and the web client's saved
# sorting, whose dashes, bars, colons and quotes the rules that count
# special characters refuse from paranoia 2. Those rules skip the arguments
# only while every argument holds one of those shapes, none of which can
# carry an attack; one argument holding anything else and the whole request
# is read as usual. Text people type or that comes from the library or a
# metadata provider, a search, a name to filter by, a playlist's name or a
# device's, a picture's address, is read as at paranoia 2, whose attack
# rules all still read it. A password is not read at all, as in CRS's own
# WordPress set. The rules named are the ones CRS 4.29 tripped on the
# clients' requests, captured from a server in use and read from the Roku
# client's source, and on the names of that server's films, shows and
# people.
#
# Jellyfin is taken to be served at the root of its name. Not covered yet:
# the dashboard's settings pages, metadata editing but for taking a
# provider's pictures, live TV setup, plugins and their pages.

# Turned off, the set takes its own rules out.
SecRule TX:jellyfin-rule-exclusions-plugin_enabled "@eq 0" \
    "id:21099,\
    phase:1,\
    pass,\
    nolog,\
    ver:'jellyfin-rule-exclusions/1.4.0',\
    ctl:ruleRemoveById=21100-21999"

# CRS sets its default methods (rule 901160) after the plugins run, so the
# default is set here first, for the API's own to be added to.
SecRule &TX:allowed_methods "@eq 0" \
    "id:21100,\
    phase:1,\
    pass,\
    nolog,\
    ver:'jellyfin-rule-exclusions/1.4.0',\
    setvar:'tx.allowed_methods=GET HEAD POST OPTIONS'"

# The API takes back a favourite, a played mark or a rating with DELETE.
SecRule REQUEST_FILENAME "!@beginsWith /web/" \
    "id:21101,\
    phase:1,\
    pass,\
    t:none,\
    nolog,\
    ver:'jellyfin-rule-exclusions/1.4.0',\
    setvar:'tx.allowed_methods=%{tx.allowed_methods} DELETE'"

# The web client's own settings, a file name CRS keeps from being read.
SecRule REQUEST_FILENAME "@streq /web/config.json" \
    "id:21110,\
    phase:1,\
    pass,\
    t:none,\
    nolog,\
    ver:'jellyfin-rule-exclusions/1.4.0',\
    ctl:ruleRemoveTargetById=930130;REQUEST_FILENAME"

# Players ask for streams and images without an Accept header, and seek
# with Range.
SecRule REQUEST_FILENAME "@rx (?i)^/(?:(?:videos|audio)/|userimage$|(?:items|users|artists|persons|genres|musicgenres|studios)/[^/]+/(?:images|download)(?:/|$))" \
    "id:21120,\
    phase:1,\
    pass,\
    t:none,\
    nolog,\
    ver:'jellyfin-rule-exclusions/1.4.0',\
    ctl:ruleRemoveById=920300,\
    ctl:ruleRemoveById=921230"

# The clients' Authorization header names the client, the device and its
# id, and the device's name is free text, "Sam's TV (2)" or "Büro" say,
# which the byte range checks on headers refuse. Only while the header,
# decoded as those checks decode it, has that form and no markup, since the
# dashboard lists devices by name.
SecRule REQUEST_HEADERS:Authorization "@rx ^(?:MediaBrowser|Emby) [A-Za-z]+=\"[^\"<>`\\\\{}]*\"(?:, ?[A-Za-z]+=\"[^\"<>`\\\\{}]*\")*$" \
    "id:21130,\
    phase:1,\
    pass,\
    t:none,t:urlDecodeUni,\
    nolog,\
    ver:'jellyfin-rule-exclusions/1.4.0',\
    ctl:ruleRemoveTargetById=920272;REQUEST_HEADERS:Authorization,\
    ctl:ruleRemoveTargetById=920274;REQUEST_HEADERS:Authorization"

SecRule REQUEST_HEADERS:X-Emby-Authorization "@rx ^(?:MediaBrowser|Emby) [A-Za-z]+=\"[^\"<>`\\\\{}]*\"(?:, ?[A-Za-z]+=\"[^\"<>`\\\\{}]*\")*$" \
    "id:21131,\
    phase:1,\
    pass,\
    t:none,t:urlDecodeUni,\
    nolog,\
    ver:'jellyfin-rule-exclusions/1.4.0',\
    ctl:ruleRemoveTargetById=920272;REQUEST_HEADERS:X-Emby-Authorization,\
    ctl:ruleRemoveTargetById=920274;REQUEST_HEADERS:X-Emby-Authorization"

# A client's name leads its User-Agent, and the check for Unix commands
# takes a name that begins with who or dnf for the command. It skips the
# header while the header holds none of the shell's operators, quotes or
# braces, without which no command can follow.
SecRule REQUEST_HEADERS:User-Agent "@rx ^[A-Za-z0-9 ._/+()-]*$" \
    "id:21132,\
    phase:1,\
    pass,\
    t:none,\
    nolog,\
    ver:'jellyfin-rule-exclusions/1.4.0',\
    ctl:ruleRemoveTargetById=932238;REQUEST_HEADERS:User-Agent"

# A client's log goes up as text, which is kept rather than read: read as a
# form, its lines are argument names that trip the injection rules.
SecRule REQUEST_FILENAME "@rx (?i)^/clientlog/document$" \
    "id:21140,\
    phase:1,\
    pass,\
    t:none,\
    nolog,\
    ver:'jellyfin-rule-exclusions/1.4.0',\
    ctl:requestBodyAccess=Off,\
    ctl:ruleRemoveById=920420"

# A request with an argument, or an argument's name, of any shape but the
# clients' is marked. Text and passwords are left out: the rules below
# handle them. The Roku client puts a space after each comma of a list. A
# device profile's conditions list codec profiles, some with a space in,
# "constrained baseline" say; the device's names in a profile are text.
SecRule ARGS_NAMES "!@rx ^[A-Za-z0-9_.-]+$" \
    "id:21150,\
    phase:2,\
    pass,\
    t:none,\
    nolog,\
    ver:'jellyfin-rule-exclusions/1.4.0',\
    setvar:'tx.jellyfin-rule-exclusions-plugin_other_shape=1'"

SecRule ARGS|!ARGS:/(?i)^json\.deviceprofile\./|!ARGS:/(?i)^(?:searchterm|namestartswith|namestartswithorgreater|namelessthan|person|name|genres|studios|tags|excludetags|officialratings|artists|albums|providername|imageurl|json\.name|json\.username|json\.groupname|json\.searchinfo\.name|json\.searchprovidername|json\.imageurl|json\.pw|json\.currentpw|json\.newpw)$/ "!@rx ^(?:[A-Za-z0-9_.-]+(?:(?:, ?|[|])[A-Za-z0-9_.-]+)*|[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(?:\.[0-9]{1,7})?(?:Z|[+-][0-9]{2}:[0-9]{2})?|\{(?:\"[A-Za-z0-9_]+\":(?:\"[A-Za-z0-9_.,|-]*\"|[A-Za-z0-9_.-]+),?)*\})?$" \
    "id:21151,\
    phase:2,\
    pass,\
    t:none,\
    nolog,\
    ver:'jellyfin-rule-exclusions/1.4.0',\
    setvar:'tx.jellyfin-rule-exclusions-plugin_other_shape=1'"

SecRule ARGS:/(?i)^json\.deviceprofile\./|!ARGS:/(?i)^json\.deviceprofile\.(?:identification\.)?(?:friendlyname|manufacturer|modelname|modeldescription|modelnumber|serialnumber)$/ "!@rx ^(?:[A-Za-z0-9_.-]+(?: [A-Za-z0-9_.-]+)*(?:[,|][A-Za-z0-9_.-]+(?: [A-Za-z0-9_.-]+)*)*|[a-z]+/[a-z0-9.+-]+)?$" \
    "id:21152,\
    phase:2,\
    pass,\
    t:none,\
    nolog,\
    ver:'jellyfin-rule-exclusions/1.4.0',\
    setvar:'tx.jellyfin-rule-exclusions-plugin_other_shape=1'"

# With none marked, the rules that count special characters skip the
# arguments and their names, and repeated names, which is how the clients
# send a list, are not taken for parameter pollution. Text in the query
# string is in the raw URI too, where the check for what is not ASCII reads
# it again. The web client's saved sorting, JSON in a string, reads as
# quoted SQL to two more rules, and its settings' id is named like the id
# command. A word that begins with who or dnf, a client's name as it saves
# its settings, is taken for the command.
SecRule &TX:jellyfin-rule-exclusions-plugin_other_shape "@eq 0" \
    "id:21153,\
    phase:2,\
    pass,\
    t:none,\
    nolog,\
    ver:'jellyfin-rule-exclusions/1.4.0',\
    ctl:ruleRemoveTargetById=920272;REQUEST_URI_RAW,\
    ctl:ruleRemoveTargetById=932238;ARGS,\
    ctl:ruleRemoveTargetById=920273;ARGS,\
    ctl:ruleRemoveTargetById=920273;ARGS_NAMES,\
    ctl:ruleRemoveTargetById=942430;ARGS,\
    ctl:ruleRemoveTargetById=942430;ARGS_NAMES,\
    ctl:ruleRemoveTargetById=942431;ARGS,\
    ctl:ruleRemoveTargetById=942431;ARGS_NAMES,\
    ctl:ruleRemoveTargetById=942432;ARGS,\
    ctl:ruleRemoveTargetById=942432;ARGS_NAMES,\
    ctl:ruleRemoveTargetById=942460;ARGS,\
    ctl:ruleRemoveTargetById=932350;ARGS_NAMES:json.id,\
    ctl:ruleRemoveTargetById=942200;ARGS:/(?i)^json\.customprefs\./,\
    ctl:ruleRemoveTargetById=942340;ARGS:/(?i)^json\.customprefs\./,\
    ctl:ruleRemoveById=921180"

# Text: a search, a name to filter by, a user's, a playlist's or a group's
# name, a device's names in its profile ("Type: TV" for its kind), and a
# metadata provider's name and the address of a picture it offers, which
# for a studio's picture holds the studio's name as it is, in any
# language. It is read as at paranoia 2: the rules that count
# characters or refuse what is not ASCII skip it, and so do the paranoia 3
# rules real titles trip, "!!" read as the shell's history or a quoted word
# as a tick. Every paranoia 1 and 2 rule still reads it.
SecAction \
    "id:21160,\
    phase:1,\
    pass,\
    nolog,\
    ver:'jellyfin-rule-exclusions/1.4.0',\
    ctl:ruleRemoveTargetById=920272;ARGS:/(?i)^(?:searchterm|namestartswith|namestartswithorgreater|namelessthan|person|name|genres|studios|tags|excludetags|officialratings|artists|albums|providername|imageurl|json\.name|json\.username|json\.groupname|json\.searchinfo\.name|json\.searchprovidername|json\.imageurl|json\.deviceprofile\.(?:identification\.)?(?:friendlyname|manufacturer|modelname|modeldescription|modelnumber|serialnumber))$/,\
    ctl:ruleRemoveTargetById=920273;ARGS:/(?i)^(?:searchterm|namestartswith|namestartswithorgreater|namelessthan|person|name|genres|studios|tags|excludetags|officialratings|artists|albums|providername|imageurl|json\.name|json\.username|json\.groupname|json\.searchinfo\.name|json\.searchprovidername|json\.imageurl|json\.deviceprofile\.(?:identification\.)?(?:friendlyname|manufacturer|modelname|modeldescription|modelnumber|serialnumber))$/,\
    ctl:ruleRemoveTargetById=942430;ARGS:/(?i)^(?:searchterm|namestartswith|namestartswithorgreater|namelessthan|person|name|genres|studios|tags|excludetags|officialratings|artists|albums|providername|imageurl|json\.name|json\.username|json\.groupname|json\.searchinfo\.name|json\.searchprovidername|json\.imageurl|json\.deviceprofile\.(?:identification\.)?(?:friendlyname|manufacturer|modelname|modeldescription|modelnumber|serialnumber))$/,\
    ctl:ruleRemoveTargetById=942431;ARGS:/(?i)^(?:searchterm|namestartswith|namestartswithorgreater|namelessthan|person|name|genres|studios|tags|excludetags|officialratings|artists|albums|providername|imageurl|json\.name|json\.username|json\.groupname|json\.searchinfo\.name|json\.searchprovidername|json\.imageurl|json\.deviceprofile\.(?:identification\.)?(?:friendlyname|manufacturer|modelname|modeldescription|modelnumber|serialnumber))$/,\
    ctl:ruleRemoveTargetById=942432;ARGS:/(?i)^(?:searchterm|namestartswith|namestartswithorgreater|namelessthan|person|name|genres|studios|tags|excludetags|officialratings|artists|albums|providername|imageurl|json\.name|json\.username|json\.groupname|json\.searchinfo\.name|json\.searchprovidername|json\.imageurl|json\.deviceprofile\.(?:identification\.)?(?:friendlyname|manufacturer|modelname|modeldescription|modelnumber|serialnumber))$/,\
    ctl:ruleRemoveTargetById=942460;ARGS:/(?i)^(?:searchterm|namestartswith|namestartswithorgreater|namelessthan|person|name|genres|studios|tags|excludetags|officialratings|artists|albums|providername|imageurl|json\.name|json\.username|json\.groupname|json\.searchinfo\.name|json\.searchprovidername|json\.imageurl|json\.deviceprofile\.(?:identification\.)?(?:friendlyname|manufacturer|modelname|modeldescription|modelnumber|serialnumber))$/,\
    ctl:ruleRemoveTargetById=932238;ARGS:/(?i)^(?:searchterm|namestartswith|namestartswithorgreater|namelessthan|person|name|genres|studios|tags|excludetags|officialratings|artists|albums|providername|imageurl|json\.name|json\.username|json\.groupname|json\.searchinfo\.name|json\.searchprovidername|json\.imageurl|json\.deviceprofile\.(?:identification\.)?(?:friendlyname|manufacturer|modelname|modeldescription|modelnumber|serialnumber))$/,\
    ctl:ruleRemoveTargetById=932290;ARGS:/(?i)^(?:searchterm|namestartswith|namestartswithorgreater|namelessthan|person|name|genres|studios|tags|excludetags|officialratings|artists|albums|providername|imageurl|json\.name|json\.username|json\.groupname|json\.searchinfo\.name|json\.searchprovidername|json\.imageurl|json\.deviceprofile\.(?:identification\.)?(?:friendlyname|manufacturer|modelname|modeldescription|modelnumber|serialnumber))$/,\
    ctl:ruleRemoveTargetById=932331;ARGS:/(?i)^(?:searchterm|namestartswith|namestartswithorgreater|namelessthan|person|name|genres|studios|tags|excludetags|officialratings|artists|albums|providername|imageurl|json\.name|json\.username|json\.groupname|json\.searchinfo\.name|json\.searchprovidername|json\.imageurl|json\.deviceprofile\.(?:identification\.)?(?:friendlyname|manufacturer|modelname|modeldescription|modelnumber|serialnumber))$/,\
    ctl:ruleRemoveTargetById=932350;ARGS:/(?i)^(?:searchterm|namestartswith|namestartswithorgreater|namelessthan|person|name|genres|studios|tags|excludetags|officialratings|artists|albums|providername|imageurl|json\.name|json\.username|json\.groupname|json\.searchinfo\.name|json\.searchprovidername|json\.imageurl|json\.deviceprofile\.(?:identification\.)?(?:friendlyname|manufacturer|modelname|modeldescription|modelnumber|serialnumber))$/,\
    ctl:ruleRemoveTargetById=933161;ARGS:/(?i)^(?:searchterm|namestartswith|namestartswithorgreater|namelessthan|person|name|genres|studios|tags|excludetags|officialratings|artists|albums|providername|imageurl|json\.name|json\.username|json\.groupname|json\.searchinfo\.name|json\.searchprovidername|json\.imageurl|json\.deviceprofile\.(?:identification\.)?(?:friendlyname|manufacturer|modelname|modeldescription|modelnumber|serialnumber))$/,\
    ctl:ruleRemoveTargetById=933211;ARGS:/(?i)^(?:searchterm|namestartswith|namestartswithorgreater|namelessthan|person|name|genres|studios|tags|excludetags|officialratings|artists|albums|providername|imageurl|json\.name|json\.username|json\.groupname|json\.searchinfo\.name|json\.searchprovidername|json\.imageurl|json\.deviceprofile\.(?:identification\.)?(?:friendlyname|manufacturer|modelname|modeldescription|modelnumber|serialnumber))$/,\
    ctl:ruleRemoveTargetById=942251;ARGS:/(?i)^(?:searchterm|namestartswith|namestartswithorgreater|namelessthan|person|name|genres|studios|tags|excludetags|officialratings|artists|albums|providername|imageurl|json\.name|json\.username|json\.groupname|json\.searchinfo\.name|json\.searchprovidername|json\.imageurl|json\.deviceprofile\.(?:identification\.)?(?:friendlyname|manufacturer|modelname|modeldescription|modelnumber|serialnumber))$/,\
    ctl:ruleRemoveTargetById=942511;ARGS:/(?i)^(?:searchterm|namestartswith|namestartswithorgreater|namelessthan|person|name|genres|studios|tags|excludetags|officialratings|artists|albums|providername|imageurl|json\.name|json\.username|json\.groupname|json\.searchinfo\.name|json\.searchprovidername|json\.imageurl|json\.deviceprofile\.(?:identification\.)?(?:friendlyname|manufacturer|modelname|modeldescription|modelnumber|serialnumber))$/"

# A password is whatever its owner chose, and Jellyfin only hashes it.
SecRule REQUEST_FILENAME "@rx (?i)^/users/(?:authenticatebyname|password|[0-9a-f-]{32,36}/password)$" \
    "id:21170,\
    phase:1,\
    pass,\
    t:none,\
    nolog,\
    ver:'jellyfin-rule-exclusions/1.4.0',\
    ctl:ruleRemoveTargetByTag=OWASP_CRS;ARGS:/(?i)^json\.(?:pw|currentpw|newpw)$/"

# Taking a picture a metadata provider offers, or identifying an item by a
# match one found, sends the picture's address, on the provider's own site.
# The check for links off the site skips it while it is the only address
# and a web one, on a host with a name.
SecRule REQUEST_FILENAME "@rx (?i)^/items/(?:remotesearch/apply/[0-9a-f-]{32,36}|[0-9a-f-]{32,36}/remoteimages/download)$" \
    "id:21180,\
    phase:2,\
    pass,\
    t:none,\
    nolog,\
    ver:'jellyfin-rule-exclusions/1.4.0',\
    chain"
    SecRule &ARGS:/(?i)^(?:json\.)?imageurl$/ "@eq 1" \
        "t:none,\
        chain"
        SecRule ARGS:/(?i)^(?:json\.)?imageurl$/ "@rx ^https?://[A-Za-z0-9-]+(?:\.[A-Za-z0-9-]+)+(?::[0-9]+)?/" \
            "t:none,\
            ctl:ruleRemoveTargetById=931130;ARGS:/(?i)^(?:json\.)?imageurl$/"

# Part of the API names an artist, a genre, a music genre, a person or a
# studio in the path, /Persons/<name>/Images/Primary say. CRS 4.30 reads the
# path for Unix commands, and takes a name that begins with a command's,
# Watch, Top or Sleep say, for one. Under those five the rules that began
# reading the path in 4.30 skip it, until CRS stops taking names for
# commands. Every other rule still reads it.
SecRule REQUEST_FILENAME "@rx (?i)^/(?:artists|genres|musicgenres|persons|studios)/." \
    "id:21190,\
    phase:1,\
    pass,\
    t:none,\
    nolog,\
    ver:'jellyfin-rule-exclusions/1.4.0',\
    ctl:ruleRemoveTargetById=932125;REQUEST_FILENAME,\
    ctl:ruleRemoveTargetById=932130;REQUEST_FILENAME,\
    ctl:ruleRemoveTargetById=932140;REQUEST_FILENAME,\
    ctl:ruleRemoveTargetById=932175;REQUEST_FILENAME,\
    ctl:ruleRemoveTargetById=932220;REQUEST_FILENAME,\
    ctl:ruleRemoveTargetById=932230;REQUEST_FILENAME,\
    ctl:ruleRemoveTargetById=932231;REQUEST_FILENAME,\
    ctl:ruleRemoveTargetById=932232;REQUEST_FILENAME,\
    ctl:ruleRemoveTargetById=932235;REQUEST_FILENAME,\
    ctl:ruleRemoveTargetById=932236;REQUEST_FILENAME,\
    ctl:ruleRemoveTargetById=932237;REQUEST_FILENAME,\
    ctl:ruleRemoveTargetById=932238;REQUEST_FILENAME,\
    ctl:ruleRemoveTargetById=932239;REQUEST_FILENAME,\
    ctl:ruleRemoveTargetById=932240;REQUEST_FILENAME,\
    ctl:ruleRemoveTargetById=932250;REQUEST_FILENAME,\
    ctl:ruleRemoveTargetById=932260;REQUEST_FILENAME,\
    ctl:ruleRemoveTargetById=932270;REQUEST_FILENAME,\
    ctl:ruleRemoveTargetById=932280;REQUEST_FILENAME,\
    ctl:ruleRemoveTargetById=932281;REQUEST_FILENAME,\
    ctl:ruleRemoveTargetById=932300;REQUEST_FILENAME,\
    ctl:ruleRemoveTargetById=932301;REQUEST_FILENAME,\
    ctl:ruleRemoveTargetById=932310;REQUEST_FILENAME,\
    ctl:ruleRemoveTargetById=932320;REQUEST_FILENAME,\
    ctl:ruleRemoveTargetById=932330;REQUEST_FILENAME,\
    ctl:ruleRemoveTargetById=932331;REQUEST_FILENAME,\
    ctl:ruleRemoveTargetById=932340;REQUEST_FILENAME,\
    ctl:ruleRemoveTargetById=932350;REQUEST_FILENAME,\
    ctl:ruleRemoveTargetById=932370;REQUEST_FILENAME,\
    ctl:ruleRemoveTargetById=932371;REQUEST_FILENAME,\
    ctl:ruleRemoveTargetById=932380;REQUEST_FILENAME,\
    ctl:ruleRemoveTargetById=932390;REQUEST_FILENAME"
