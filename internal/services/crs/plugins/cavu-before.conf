# Ostiole's Cavu rule exclusions, 1.0.0.
#
# Rule ID block: 23,000 - 23,999
#
# What Cavu's web client sends scores nothing at paranoia 1 to 4, and
# everything else is read as CRS reads it. It sends UUIDs, numbers, words,
# a stream's token, a passkey's answer in base64url and a codec's profiles,
# whose dashes and spaces the rules that count special characters refuse
# from paranoia 2. Those rules skip the arguments only while every argument
# holds one of those shapes, none of which can carry an attack; one argument
# holding anything else and the whole request is read as usual. Text, a
# search, a title, a device's name, a folder's path, and the lines the
# client logs while Cavu runs in development, is read as at paranoia 1. A
# password or a
# provider's key is not read at all. The rules named are the ones CRS 4.30
# tripped on a server in use, read with the client's source.
#
# Cavu is taken to be served at the root of its name.

# Turned off, the set takes its own rules out.
SecRule TX:cavu-rule-exclusions-plugin_enabled "@eq 0" \
    "id:23099,\
    phase:1,\
    pass,\
    nolog,\
    ver:'cavu-rule-exclusions/1.0.0',\
    ctl:ruleRemoveById=23100-23999"

# CRS sets its default methods (rule 901160) and content types (901162)
# after the plugins run, so the defaults are set here first, for Cavu's
# own to be added to.
SecRule &TX:allowed_methods "@eq 0" \
    "id:23100,\
    phase:1,\
    pass,\
    nolog,\
    ver:'cavu-rule-exclusions/1.0.0',\
    setvar:'tx.allowed_methods=GET HEAD POST OPTIONS'"

SecRule &TX:allowed_request_content_type "@eq 0" \
    "id:23102,\
    phase:1,\
    pass,\
    nolog,\
    ver:'cavu-rule-exclusions/1.0.0',\
    setvar:'tx.allowed_request_content_type=|application/x-www-form-urlencoded| |multipart/form-data| |text/xml| |application/xml| |application/soap+xml| |application/json|'"

# The API edits with PUT and PATCH and takes things away with DELETE.
SecRule REQUEST_FILENAME "@beginsWith /api/v1/" \
    "id:23101,\
    phase:1,\
    pass,\
    t:none,\
    nolog,\
    ver:'cavu-rule-exclusions/1.0.0',\
    setvar:'tx.allowed_methods=%{tx.allowed_methods} PUT PATCH DELETE'"

# When a page goes away, the music player sends its last position, its
# events and its state with sendBeacon, as JSON in a text/plain body, which
# CRS refuses and would read as one long argument name. On those five
# routes such a body is read as the JSON it is, and refused when it does
# not parse.
SecRule REQUEST_FILENAME "@rx ^/api/v1/music/(?:sessions/[0-9a-f-]{36}/(?:events|stop)|queue/position|connect/(?:state|tab))$" \
    "id:23103,\
    phase:1,\
    pass,\
    t:none,\
    nolog,\
    ver:'cavu-rule-exclusions/1.0.0',\
    chain"
    SecRule REQUEST_METHOD "@streq POST" \
        "t:none,\
        chain"
        SecRule REQUEST_HEADERS:Content-Type "@rx (?i)^text/plain(?:\s*;\s*charset=utf-8)?$" \
            "t:none,\
            ctl:requestBodyProcessor=JSON,\
            setvar:'tx.allowed_request_content_type=%{tx.allowed_request_content_type} |text/plain|'"

# Players seek in a stream and in a picture subtitle track with Range.
SecRule REQUEST_FILENAME "@rx ^/api/v1/(?:stream/[A-Za-z0-9_-]+/[A-Za-z0-9_.-]+|files/[0-9a-f-]{36}/subtitles/[A-Za-z0-9_-]+/pgs)$" \
    "id:23110,\
    phase:1,\
    pass,\
    t:none,\
    nolog,\
    ver:'cavu-rule-exclusions/1.0.0',\
    ctl:ruleRemoveById=921230"

# A picture is asked for at a width, w, named like the w command. Only the
# check for commands' names skips that name there.
SecRule REQUEST_FILENAME "@rx ^/api/v1/images/[0-9a-f-]{36}$" \
    "id:23111,\
    phase:1,\
    pass,\
    t:none,\
    nolog,\
    ver:'cavu-rule-exclusions/1.0.0',\
    ctl:ruleRemoveTargetById=932350;ARGS_NAMES:w"

# The most played and the history of what played are paths that end in
# top and history, both commands. Only the check for commands' names skips
# those two paths.
SecRule REQUEST_FILENAME "@rx ^/api/v1/music/(?:stats/top|history)$" \
    "id:23112,\
    phase:1,\
    pass,\
    t:none,\
    nolog,\
    ver:'cavu-rule-exclusions/1.0.0',\
    ctl:ruleRemoveTargetById=932350;REQUEST_FILENAME"

# The client's scripts and styles are named by Vite, a name and eight
# random characters, which now and then spell a command (AdminLayout-DNf-
# for dnf). Only the check that reads them so skips those names.
SecRule REQUEST_FILENAME "@rx ^/assets/[A-Za-z0-9_]+-[A-Za-z0-9_-]{8}\.(?:js|css)$" \
    "id:23113,\
    phase:1,\
    pass,\
    t:none,\
    nolog,\
    ver:'cavu-rule-exclusions/1.0.0',\
    ctl:ruleRemoveTargetById=932237;REQUEST_FILENAME"

# A password is whatever its owner chose, and Cavu only hashes it: an
# account's, at setup, sign-in, a step-up, a reset, an invite or a change.
SecRule REQUEST_FILENAME "@rx ^/api/v1/(?:auth/(?:login|setup|step-up)|me/password|reset/[A-Za-z0-9_-]+|invites/[A-Za-z0-9_-]+/accept)$" \
    "id:23170,\
    phase:1,\
    pass,\
    t:none,\
    nolog,\
    ver:'cavu-rule-exclusions/1.0.0',\
    ctl:ruleRemoveTargetByTag=OWASP_CRS;ARGS:/(?i)^json\.(?:password|currentpassword|newpassword)$/"

# A metadata provider's key, or its password, is whatever the provider
# issued or its owner chose.
SecRule REQUEST_FILENAME "@rx ^/api/v1/admin/providers/[a-z0-9_-]+$" \
    "id:23172,\
    phase:1,\
    pass,\
    t:none,\
    nolog,\
    ver:'cavu-rule-exclusions/1.0.0',\
    ctl:ruleRemoveTargetByTag=OWASP_CRS;ARGS:/(?i)^json\.key$/,\
    ctl:ruleRemoveTargetByTag=OWASP_CRS;ARGS:/(?i)^json\.password$/"

# A request with an argument, or an argument's name, of any shape but the
# client's is marked. Text and secrets are left out: the rules below
# handle them. A codec's profiles are words with spaces, "high 10" or
# "constrained baseline".
SecRule ARGS_NAMES "!@rx ^[A-Za-z0-9_.-]+$" \
    "id:23150,\
    phase:2,\
    pass,\
    t:none,\
    nolog,\
    ver:'cavu-rule-exclusions/1.0.0',\
    setvar:'tx.cavu-rule-exclusions-plugin_other_shape=1'"

SecRule ARGS|!ARGS:/(?i)^(?:q|path|json\.(?:q|name|device|artist|album|message|paths\.[0-9]+|queue\.context\.title))$/|!ARGS:/(?i)^json\.entries\.[0-9]+\.msg$/|!ARGS:/(?i)^json\.(?:password|currentpassword|newpassword)$/|!ARGS:/(?i)^json\.key$/|!ARGS:/(?i)^json\.profile\.video\.[0-9]+\.profiles\.[0-9]+$/ "!@rx ^(?:[A-Za-z0-9_.-]+(?:,[A-Za-z0-9_.-]+)*|[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}(?::[0-9]{2}(?:\.[0-9]{1,9})?)?(?:Z|[+-][0-9]{2}:[0-9]{2})?|[0-9]{2}:[0-9]{2}(?::[0-9]{2})?|[A-Za-z]+(?:/[A-Za-z0-9_+-]+){1,2}|[A-Za-z0-9_.+-]+@[A-Za-z0-9-]+(?:\.[A-Za-z0-9-]+)+|(?:/[A-Za-z0-9_.-]+)+/?|/)?$" \
    "id:23151,\
    phase:2,\
    pass,\
    t:none,\
    nolog,\
    ver:'cavu-rule-exclusions/1.0.0',\
    setvar:'tx.cavu-rule-exclusions-plugin_other_shape=1'"

SecRule ARGS:/(?i)^json\.profile\.video\.[0-9]+\.profiles\.[0-9]+$/ "!@rx ^[a-z0-9]+(?: [a-z0-9]+){0,3}$" \
    "id:23152,\
    phase:2,\
    pass,\
    t:none,\
    nolog,\
    ver:'cavu-rule-exclusions/1.0.0',\
    setvar:'tx.cavu-rule-exclusions-plugin_other_shape=1'"

# With none marked, the rules that count special characters skip the
# arguments and their names. A search's text is in the query string, and
# so in the raw URI too, where the check for what is not ASCII reads it
# again. The id an item is matched to, a cover chosen or a device handed
# the music is named like the id command.
SecRule &TX:cavu-rule-exclusions-plugin_other_shape "@eq 0" \
    "id:23153,\
    phase:2,\
    pass,\
    t:none,\
    nolog,\
    ver:'cavu-rule-exclusions/1.0.0',\
    ctl:ruleRemoveTargetById=920273;ARGS,\
    ctl:ruleRemoveTargetById=920273;ARGS_NAMES,\
    ctl:ruleRemoveTargetById=942430;ARGS,\
    ctl:ruleRemoveTargetById=942430;ARGS_NAMES,\
    ctl:ruleRemoveTargetById=942431;ARGS,\
    ctl:ruleRemoveTargetById=942431;ARGS_NAMES,\
    ctl:ruleRemoveTargetById=942432;ARGS,\
    ctl:ruleRemoveTargetById=942432;ARGS_NAMES,\
    ctl:ruleRemoveTargetById=942460;ARGS,\
    ctl:ruleRemoveTargetById=920272;REQUEST_URI_RAW,\
    ctl:ruleRemoveTargetById=932350;ARGS_NAMES:json.id"

# A passkey's answer is random bytes in base64url, which now and then
# spell a word the SQL and command rules take for an attack, or two dashes
# or 0x that read as SQL: about one answer in five hundred, as the Tendrils
# set found. With none marked, those rules skip the answer's random parts.
SecRule &TX:cavu-rule-exclusions-plugin_other_shape "@eq 0" \
    "id:23181,\
    phase:2,\
    pass,\
    t:none,\
    nolog,\
    ver:'cavu-rule-exclusions/1.0.0',\
    chain"
    SecRule REQUEST_FILENAME "@rx ^/api/v1/(?:auth/(?:login/|step-up/)?passkey|me/mfa/passkeys)/finish$" \
        "t:none,\
        ctl:ruleRemoveTargetById=932236;ARGS:/(?i)^json\.credential\.(?:id|rawid|response\.(?:clientdatajson|authenticatordata|signature|userhandle|attestationobject|publickey))$/,\
        ctl:ruleRemoveTargetById=932238;ARGS:/(?i)^json\.credential\.(?:id|rawid|response\.(?:clientdatajson|authenticatordata|signature|userhandle|attestationobject|publickey))$/,\
        ctl:ruleRemoveTargetById=942100;ARGS:/(?i)^json\.credential\.(?:id|rawid|response\.(?:clientdatajson|authenticatordata|signature|userhandle|attestationobject|publickey))$/,\
        ctl:ruleRemoveTargetById=942210;ARGS:/(?i)^json\.credential\.(?:id|rawid|response\.(?:clientdatajson|authenticatordata|signature|userhandle|attestationobject|publickey))$/,\
        ctl:ruleRemoveTargetById=942440;ARGS:/(?i)^json\.credential\.(?:id|rawid|response\.(?:clientdatajson|authenticatordata|signature|userhandle|attestationobject|publickey))$/,\
        ctl:ruleRemoveTargetById=942450;ARGS:/(?i)^json\.credential\.(?:id|rawid|response\.(?:clientdatajson|authenticatordata|signature|userhandle|attestationobject|publickey))$/"

# Text: a search, a match looked for by name, an album's artist and
# title, a device's name, a queue's title, a library's folders and the
# folder browsed to, and the message a player reports. It is read as at
# paranoia 1: every paranoia 2 to 4 rule titles and prose trip skips it,
# the list the Tendrils set keeps for its titles and notes. A title that
# begins with a verb that is also a command, "Kill" or "Watch" say, is
# read as one from paranoia 2, and "Echo & the Tide" as two. Every
# paranoia 1 rule still reads it.
