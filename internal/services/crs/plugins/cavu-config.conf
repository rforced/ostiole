# Ostiole's Cavu rule exclusions, 1.0.0. Rules are in cavu-before.conf.
#
# Rule ID block: 23,000 - 23,999
#
# On unless tx.cavu-rule-exclusions-plugin_enabled is set to 0 first.
SecRule &TX:cavu-rule-exclusions-plugin_enabled "@eq 0" \
    "id:23010,\
    phase:1,\
    pass,\
    nolog,\
    ver:'cavu-rule-exclusions/1.0.0',\
    setvar:'tx.cavu-rule-exclusions-plugin_enabled=1'"
