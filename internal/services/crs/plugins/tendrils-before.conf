    ctl:ruleRemoveTargetById=932238;ARGS:/(?i)^(?:q|json\.(?:title|name|display_name|nickname|unit|instance_name|confirm|goal\.metric\.unit|notes|note|body|ideas|checkin_note|items\.[0-9]+(?:\.children\.[0-9]+)*\.(?:title|notes|comments\.[0-9]+)))$/,\
