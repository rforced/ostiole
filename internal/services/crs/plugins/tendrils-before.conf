# Ostiole's Tendrils rule exclusions, 1.0.0.
#
# Rule ID block: 22,000 - 22,999
#
# What Tendrils' web client sends scores nothing at paranoia 1 to 4, and
# everything else is read as CRS reads it. The client sends UUIDs, dates,
# times, time zone names, numbers, words, email addresses, a passkey's
# answer in base64url and a repeat rule, whose dashes, slashes, colons and
# at signs the rules that count special characters refuse from paranoia
# 2. Those rules skip the arguments only while every argument holds
# one of those shapes, none of which can carry an attack; one argument
# holding anything else and the whole request is read as usual. Text
# people type, titles, names, notes, comments and the journal, is read as
# at paranoia 1, whose attack rules all still read it: a to-do's title
# begins with a verb, and many verbs are commands. A password is not read
# at all, as in CRS's own WordPress set. The rules named are the ones CRS
# 4.30 tripped on the client's requests, seen on a server in use and read
# from the client's source, on random tokens and passkey answers, and on
# titles and prose from the Leipzig corpora.
#
# Tendrils is taken to be served at the root of its name. A file whose
# name has a quote in it is refused at every level, as CRS alone refuses
# it.

# Turned off, the set takes its own rules out.
SecRule TX:tendrils-rule-exclusions-plugin_enabled "@eq 0" \
    "id:22099,\
    phase:1,\
    pass,\
    nolog,\
    ver:'tendrils-rule-exclusions/1.0.0',\
    ctl:ruleRemoveById=22100-22999"

# CRS sets its default methods (rule 901160) after the plugins run, so the
# default is set here first, for the API's own to be added to.
SecRule &TX:allowed_methods "@eq 0" \
    "id:22100,\
    phase:1,\
    pass,\
    nolog,\
    ver:'tendrils-rule-exclusions/1.0.0',\
    setvar:'tx.allowed_methods=GET HEAD POST OPTIONS'"

# The API edits with PUT and PATCH and takes things away with DELETE.
SecRule REQUEST_FILENAME "@beginsWith /api/v1/" \
    "id:22101,\
    phase:1,\
    pass,\
    t:none,\
    nolog,\
    ver:'tendrils-rule-exclusions/1.0.0',\
    setvar:'tx.allowed_methods=%{tx.allowed_methods} PUT PATCH DELETE'"

# The session cookie is 32 random bytes in base64url, whose dashes the
# paranoia 4 count of special characters in cookies takes for SQL in about
# one session in thirty. It skips the cookie while it is the only one and
# has that form.
SecRule &REQUEST_COOKIES:/(?i)^(?:__host-)?tendril_session$/ "@eq 1" \
    "id:22130,\
    phase:1,\
    pass,\
    t:none,\
    nolog,\
    ver:'tendrils-rule-exclusions/1.0.0',\
    chain"
    SecRule REQUEST_COOKIES:/(?i)^(?:__host-)?tendril_session$/ "@rx ^[A-Za-z0-9_-]{43}$" \
        "t:none,\
        ctl:ruleRemoveTargetById=942421;REQUEST_COOKIES:/(?i)^(?:__host-)?tendril_session$/"

# A password is whatever its owner chose, and Tendrils only hashes it: an
# account's, or the one a share is opened with.
SecRule REQUEST_FILENAME "@rx ^/api/v1/(?:auth/(?:setup|register|login|password(?:/reset|/set)?)|shares(?:/[0-9a-f-]{36})?|public/shares/[A-Za-z0-9_-]+/open)$" \
    "id:22170,\
    phase:1,\
    pass,\
    t:none,\
    nolog,\
    ver:'tendrils-rule-exclusions/1.0.0',\
    ctl:ruleRemoveTargetByTag=OWASP_CRS;ARGS:/(?i)^json\.(?:password|current_password|new_password)$/"

# Confirming who you are before a change sends a code, or the password
# when the method is the password.
SecRule REQUEST_FILENAME "@streq /api/v1/auth/stepup/verify" \
    "id:22171,\
    phase:2,\
    pass,\
    t:none,\
    nolog,\
    ver:'tendrils-rule-exclusions/1.0.0',\
    chain"
    SecRule &ARGS:/(?i)^json\.method$/ "@eq 1" \
        "t:none,\
        chain"
        SecRule ARGS:/(?i)^json\.method$/ "@streq password" \
            "t:none,\
            ctl:ruleRemoveTargetByTag=OWASP_CRS;ARGS:/(?i)^json\.code$/,\
            ctl:ruleRemoveTargetById=22151;ARGS:/(?i)^json\.code$/"

# A request with an argument, or an argument's name, of any shape but the
# client's is marked. Text and passwords are left out: the rules below
# handle them. A repeat rule and a push service address have shapes
# of their own: a rule's parts are upper case names and values of words,
# numbers and commas, and an address is https on a host with a name, its
# last label beginning with a letter, its path and query of URL characters
# with no escapes but the three a base64 token takes, + / and =.
SecRule ARGS_NAMES "!@rx ^[A-Za-z0-9_.-]+$" \
    "id:22150,\
    phase:2,\
    pass,\
    t:none,\
    nolog,\
    ver:'tendrils-rule-exclusions/1.0.0',\
    setvar:'tx.tendrils-rule-exclusions-plugin_other_shape=1'"

SecRule ARGS|!ARGS:/(?i)^(?:q|json\.(?:title|name|display_name|nickname|unit|instance_name|confirm|goal\.metric\.unit|notes|note|body|ideas|checkin_note|items\.[0-9]+(?:\.children\.[0-9]+)*\.(?:title|notes|comments\.[0-9]+)))$/|!ARGS:/(?i)^json\.(?:password|current_password|new_password)$/|!ARGS:/(?i)^json\.(?:(?:items\.[0-9]+(?:\.children\.[0-9]+)*\.)?recurrence\.rule|rule)$/|!ARGS:/(?i)^json\.endpoint$/ "!@rx ^(?:[A-Za-z0-9_.-]+(?:,[A-Za-z0-9_.-]+)*|[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}(?::[0-9]{2}(?:\.[0-9]{1,9})?)?(?:Z|[+-][0-9]{2}:[0-9]{2})?|[0-9]{2}:[0-9]{2}(?::[0-9]{2})?|[A-Za-z]+(?:/[A-Za-z0-9_+-]+){1,2}|[A-Za-z0-9_.+-]+@[A-Za-z0-9-]+(?:\.[A-Za-z0-9-]+)+|(?:/[A-Za-z0-9_.-]+)+/?|/)?$" \
    "id:22151,\
    phase:2,\
    pass,\
    t:none,\
    nolog,\
    ver:'tendrils-rule-exclusions/1.0.0',\
    setvar:'tx.tendrils-rule-exclusions-plugin_other_shape=1'"

SecRule ARGS:/(?i)^json\.(?:(?:items\.[0-9]+(?:\.children\.[0-9]+)*\.)?recurrence\.rule|rule)$/ "!@rx ^(?:[A-Z]+=[A-Za-z0-9,+-]+(?:;[A-Z]+=[A-Za-z0-9,+-]+)*)?$" \
    "id:22152,\
    phase:2,\
    pass,\
    t:none,\
    nolog,\
    ver:'tendrils-rule-exclusions/1.0.0',\
    setvar:'tx.tendrils-rule-exclusions-plugin_other_shape=1'"

SecRule ARGS:/(?i)^json\.endpoint$/ "!@rx ^https://(?:[A-Za-z0-9-]+\.)+[A-Za-z][A-Za-z0-9-]*(?::[0-9]+)?(?:/(?:[A-Za-z0-9_.~:=+-]|%(?:2[BbFf]|3[Dd]))*)*(?:\?(?:[A-Za-z0-9_.~:=&+/-]|%(?:2[BbFf]|3[Dd]))*)?$" \
    "id:22154,\
    phase:2,\
    pass,\
    t:none,\
    nolog,\
    ver:'tendrils-rule-exclusions/1.0.0',\
    setvar:'tx.tendrils-rule-exclusions-plugin_other_shape=1'"

# With none marked, the rules that count special characters skip the
# arguments and their names. A search's text is in the query string, and
# so in the raw URI too, where the check for what is not ASCII reads it
# again. The id a new task brings is named like the id command, and the
# kinds a search looks for are listed as words, task among them, which
# after a comma reads as a command.
SecRule &TX:tendrils-rule-exclusions-plugin_other_shape "@eq 0" \
    "id:22153,\
    phase:2,\
    pass,\
    t:none,\
    nolog,\
    ver:'tendrils-rule-exclusions/1.0.0',\
    ctl:ruleRemoveTargetById=920273;ARGS,\
    ctl:ruleRemoveTargetById=920273;ARGS_NAMES,\
    ctl:ruleRemoveTargetById=942430;ARGS,\
    ctl:ruleRemoveTargetById=942430;ARGS_NAMES,\
    ctl:ruleRemoveTargetById=942431;ARGS,\
    ctl:ruleRemoveTargetById=942431;ARGS_NAMES,\
    ctl:ruleRemoveTargetById=942432;ARGS,\
    ctl:ruleRemoveTargetById=942432;ARGS_NAMES,\
    ctl:ruleRemoveTargetById=942460;ARGS,\
    ctl:ruleRemoveTargetById=920272;REQUEST_URI_RAW,\
    ctl:ruleRemoveTargetById=932350;ARGS_NAMES:json.id,\
    ctl:ruleRemoveTargetById=932236;ARGS:/(?i)^(?:kinds|types)$/"


# A passkey's answer is random bytes in base64url, which now and then
# spell a word the SQL and command rules take for an attack, or two dashes
# or 0x that read as SQL: about one answer in five hundred. With none
# marked, those rules skip the answer's random parts.
SecRule &TX:tendrils-rule-exclusions-plugin_other_shape "@eq 0" \
    "id:22181,\
    phase:2,\
    pass,\
    t:none,\
    nolog,\
    ver:'tendrils-rule-exclusions/1.0.0',\
    chain"
    SecRule REQUEST_FILENAME "@rx ^/api/v1/auth/(?:passkey/login|passkeys/register|mfa/passkey|stepup/passkey)/finish$" \
        "t:none,\
        ctl:ruleRemoveTargetById=932236;ARGS:/(?i)^json\.credential\.(?:id|rawid|response\.(?:clientdatajson|authenticatordata|signature|userhandle|attestationobject|publickey))$/,\
        ctl:ruleRemoveTargetById=932238;ARGS:/(?i)^json\.credential\.(?:id|rawid|response\.(?:clientdatajson|authenticatordata|signature|userhandle|attestationobject|publickey))$/,\
        ctl:ruleRemoveTargetById=942100;ARGS:/(?i)^json\.credential\.(?:id|rawid|response\.(?:clientdatajson|authenticatordata|signature|userhandle|attestationobject|publickey))$/,\
        ctl:ruleRemoveTargetById=942210;ARGS:/(?i)^json\.credential\.(?:id|rawid|response\.(?:clientdatajson|authenticatordata|signature|userhandle|attestationobject|publickey))$/,\
        ctl:ruleRemoveTargetById=942440;ARGS:/(?i)^json\.credential\.(?:id|rawid|response\.(?:clientdatajson|authenticatordata|signature|userhandle|attestationobject|publickey))$/,\
        ctl:ruleRemoveTargetById=942450;ARGS:/(?i)^json\.credential\.(?:id|rawid|response\.(?:clientdatajson|authenticatordata|signature|userhandle|attestationobject|publickey))$/"

# Turning notifications on sends the browser's push service address, on
# the service's own site, and the keys to encrypt with. The address ends
# in a random token, some services' encoded again in a query after a
# slash, which reads as a wildcard in a command and as encoding done twice,
# and whose decoded slashes now and then spell a system file's name; the
# keys are random. With none marked and one address, the check for links
# off the site, those three and the rules random bytes trip skip the
# address, and the rules random bytes trip skip the keys.
SecRule &TX:tendrils-rule-exclusions-plugin_other_shape "@eq 0" \
    "id:22180,\
    phase:2,\
    pass,\
    t:none,\
    nolog,\
    ver:'tendrils-rule-exclusions/1.0.0',\
    chain"
    SecRule REQUEST_FILENAME "@streq /api/v1/push/subscriptions" \
        "t:none,\
        chain"
        SecRule REQUEST_METHOD "@streq POST" \
            "t:none,\
            chain"
            SecRule &ARGS:/(?i)^json\.endpoint$/ "@eq 1" \
                "t:none,\
                ctl:ruleRemoveTargetById=920230;ARGS:/(?i)^json\.endpoint$/,\
                ctl:ruleRemoveTargetById=930120;ARGS:/(?i)^json\.endpoint$/,\
                ctl:ruleRemoveTargetById=931130;ARGS:/(?i)^json\.endpoint$/,\
                ctl:ruleRemoveTargetById=932190;ARGS:/(?i)^json\.endpoint$/,\
                ctl:ruleRemoveTargetById=932236;ARGS:/(?i)^json\.endpoint$/,\
                ctl:ruleRemoveTargetById=932238;ARGS:/(?i)^json\.endpoint$/,\
                ctl:ruleRemoveTargetById=942100;ARGS:/(?i)^json\.endpoint$/,\
                ctl:ruleRemoveTargetById=942210;ARGS:/(?i)^json\.endpoint$/,\
                ctl:ruleRemoveTargetById=942440;ARGS:/(?i)^json\.endpoint$/,\
                ctl:ruleRemoveTargetById=942450;ARGS:/(?i)^json\.endpoint$/,\
                ctl:ruleRemoveTargetById=932236;ARGS:/(?i)^json\.keys\.(?:p256dh|auth)$/,\
                ctl:ruleRemoveTargetById=932238;ARGS:/(?i)^json\.keys\.(?:p256dh|auth)$/,\
                ctl:ruleRemoveTargetById=942100;ARGS:/(?i)^json\.keys\.(?:p256dh|auth)$/,\
                ctl:ruleRemoveTargetById=942210;ARGS:/(?i)^json\.keys\.(?:p256dh|auth)$/,\
                ctl:ruleRemoveTargetById=942440;ARGS:/(?i)^json\.keys\.(?:p256dh|auth)$/,\
                ctl:ruleRemoveTargetById=942450;ARGS:/(?i)^json\.keys\.(?:p256dh|auth)$/"

# Text people type: a task's, a list's or a goal's title and notes, a
# space's, a label's or a person's name, a passkey's, a goal's unit, a
# search, the name typed to confirm deleting a space, a check-in's or a
# share's note, comments and the journal, and the same in an import. Notes,
# comments and the journal are Markdown, with links, code and lists. It is
# read as at paranoia 1: the rules above it that count characters or
# refuse what is not ASCII skip it, and so do the ones titles and prose in
# nine languages tripped, a title that begins with a verb that is also
# a command, "Watch" or "Kill" say, a quoted word read as SQL, a link off
# the site. Every paranoia 1 rule still reads it.
SecAction \
    "id:22160,\
    phase:1,\
    pass,\
    nolog,\
    ver:'tendrils-rule-exclusions/1.0.0',\
    ctl:ruleRemoveTargetById=920272;ARGS:/(?i)^(?:q|json\.(?:title|name|display_name|nickname|unit|instance_name|confirm|goal\.metric\.unit|notes|note|body|ideas|checkin_note|items\.[0-9]+(?:\.children\.[0-9]+)*\.(?:title|notes|comments\.[0-9]+)))$/,\
    ctl:ruleRemoveTargetById=920273;ARGS:/(?i)^(?:q|json\.(?:title|name|display_name|nickname|unit|instance_name|confirm|goal\.metric\.unit|notes|note|body|ideas|checkin_note|items\.[0-9]+(?:\.children\.[0-9]+)*\.(?:title|notes|comments\.[0-9]+)))$/,\
