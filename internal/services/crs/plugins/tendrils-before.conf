# Setting a password for an account that signs in with a passkey alone is
# a path that ends in set, which CRS 4.30 reads for a command. Only the
# check for the shell's builtins skips that path, until CRS stops taking
# words in a path for commands.
SecRule REQUEST_FILENAME "@streq /api/v1/auth/password/set" \
    "id:22190,\
    phase:1,\
    pass,\
    t:none,\
    nolog,\
    ver:'tendrils-rule-exclusions/1.1.2',\
    ctl:ruleRemoveTargetById=932350;REQUEST_FILENAME"
