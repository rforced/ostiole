# Ostiole's Vaultwarden rule exclusions, 1.1.0.
#
# Rule ID block: 20,000 - 20,999
#
# What Vaultwarden's own clients send scores nothing at paranoia 1 to 4, and
# everything else is read as CRS reads it. The clients encrypt every field of
# a vault item, a folder and a Send, and send ids as UUIDs, times in ISO 8601
# and tokens in base64url. Random base64 trips the SQL rules that count
# special characters or read a bar as an operator, and now and then spells a
# command, an event handler, a hex literal or a file name. So on the paths
# the clients write to, those rules skip the arguments, but only while every
# argument holds one of those shapes, none of which can carry an attack. One
# argument holding anything else, text typed where ciphertext belongs say,
# and the whole request is read as usual. The rules named are the ones a
# replay of the clients' requests with random ciphertext tripped in CRS 4.29,
# at any paranoia level.
#
# Vaultwarden is taken to be served at the root of its name. Not covered yet:
# organizations, emergency access, key rotation, two-step sign-in with Duo or
# a security key, and Sends limited to email addresses. /admin is left to CRS.

# Turned off, the set takes its own rules out.
SecRule TX:vaultwarden-rule-exclusions-plugin_enabled "@eq 0" \
    "id:20099,\
    phase:1,\
    pass,\
    nolog,\
    ver:'vaultwarden-rule-exclusions/1.1.0',\
    ctl:ruleRemoveById=20100-20999"

# CRS sets its default methods (rule 901160) after the plugins run, so the
# default is set here first, for the API's own to be added to.
SecRule &TX:allowed_methods "@eq 0" \
    "id:20100,\
    phase:1,\
    pass,\
    nolog,\
    ver:'vaultwarden-rule-exclusions/1.1.0',\
    setvar:'tx.allowed_methods=GET HEAD POST OPTIONS'"

# The API saves with PUT and deletes with DELETE.
SecRule REQUEST_FILENAME "@beginsWith /api/" \
    "id:20101,\
    phase:1,\
    pass,\
    t:none,\
    nolog,\
    ver:'vaultwarden-rule-exclusions/1.1.0',\
    setvar:'tx.allowed_methods=%{tx.allowed_methods} PUT DELETE'"

# Vault items, folders, Sends and their files; sign-in and prelogin; the
# live-update hub and attachment downloads, which carry a token in the query.
# A request with an argument of any other shape is marked. A device's name
# is free text and is left out.
SecRule REQUEST_FILENAME "@rx ^/(?:api/(?:ciphers|folders|sends)(?:/|$)|identity/connect/token$|identity/accounts/prelogin(?:/password)?$|notifications/hub$|attachments/)" \
    "id:20110,\
    phase:2,\
    pass,\
    t:none,\
    nolog,\
    ver:'vaultwarden-rule-exclusions/1.1.0',\
    chain"
    SecRule ARGS|!ARGS:devicename "!@rx ^(?:[0-9]\.[A-Za-z0-9+/]+={0,2}(?:\|[A-Za-z0-9+/]+={0,2}){0,2}|[A-Za-z0-9+/]+={0,2}|[A-Za-z0-9_-]+(?:\.[A-Za-z0-9_-]+){0,2}|[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(?:\.[0-9]{1,7})?(?:Z|[+-][0-9]{2}:[0-9]{2})|[A-Za-z0-9._+-]+@[A-Za-z0-9.-]+|api offline_access)?$" \
        "t:none,\
        setvar:'tx.vaultwarden-rule-exclusions-plugin_other_shape=1'"

# With none marked, the rules random base64 trips skip the arguments, and
# the byte range check skips the form body sign-in sends.
SecRule REQUEST_FILENAME "@rx ^/(?:api/(?:ciphers|folders|sends)(?:/|$)|identity/connect/token$|identity/accounts/prelogin(?:/password)?$|notifications/hub$|attachments/)" \
    "id:20111,\
    phase:2,\
    pass,\
    t:none,\
    nolog,\
    ver:'vaultwarden-rule-exclusions/1.1.0',\
    chain"
    SecRule &TX:vaultwarden-rule-exclusions-plugin_other_shape "@eq 0" \
        "t:none,\
        ctl:ruleRemoveTargetById=920273;ARGS,\
        ctl:ruleRemoveTargetById=920273;REQUEST_BODY,\
        ctl:ruleRemoveTargetById=921130;ARGS,\
        ctl:ruleRemoveTargetById=930120;ARGS,\
        ctl:ruleRemoveTargetById=932125;ARGS,\
        ctl:ruleRemoveTargetById=932160;ARGS,\
        ctl:ruleRemoveTargetById=932220;ARGS,\
        ctl:ruleRemoveTargetById=932230;ARGS,\
        ctl:ruleRemoveTargetById=932232;ARGS,\
        ctl:ruleRemoveTargetById=932235;ARGS,\
        ctl:ruleRemoveTargetById=932236;ARGS,\
        ctl:ruleRemoveTargetById=932238;ARGS,\
        ctl:ruleRemoveTargetById=932250;ARGS,\
        ctl:ruleRemoveTargetById=932260;ARGS,\
        ctl:ruleRemoveTargetById=932370;ARGS,\
        ctl:ruleRemoveTargetById=932371;ARGS,\
        ctl:ruleRemoveTargetById=932380;ARGS,\
        ctl:ruleRemoveTargetById=941120;ARGS,\
        ctl:ruleRemoveTargetById=941130;ARGS,\
        ctl:ruleRemoveTargetById=941150;ARGS,\
        ctl:ruleRemoveTargetById=942100;ARGS,\
        ctl:ruleRemoveTargetById=942120;ARGS,\
        ctl:ruleRemoveTargetById=942140;ARGS,\
        ctl:ruleRemoveTargetById=942180;ARGS,\
        ctl:ruleRemoveTargetById=942210;ARGS,\
        ctl:ruleRemoveTargetById=942340;ARGS,\
        ctl:ruleRemoveTargetById=942390;ARGS,\
        ctl:ruleRemoveTargetById=942430;ARGS,\
        ctl:ruleRemoveTargetById=942431;ARGS,\
        ctl:ruleRemoveTargetById=942432;ARGS,\
        ctl:ruleRemoveTargetById=942450;ARGS,\
        ctl:ruleRemoveTargetById=942460;ARGS"

# An attachment or a Send's file goes up under its encrypted name, whose
# padding and bars trip the multipart checks and now and then spell a file
# type CRS keeps out of uploads. Only while every file name is ciphertext.
SecRule REQUEST_FILENAME "@rx ^/api/(?:ciphers|sends)/" \
    "id:20120,\
    phase:2,\
    pass,\
    t:none,\
    nolog,\
    ver:'vaultwarden-rule-exclusions/1.1.0',\
    chain"
    SecRule FILES "!@rx ^[0-9]\.[A-Za-z0-9+/]+={0,2}(?:\|[A-Za-z0-9+/]+={0,2}){0,2}$" \
        "t:none,\
        setvar:'tx.vaultwarden-rule-exclusions-plugin_other_file=1'"

SecRule REQUEST_FILENAME "@rx ^/api/(?:ciphers|sends)/" \
    "id:20121,\
    phase:2,\
    pass,\
    t:none,\
    nolog,\
    ver:'vaultwarden-rule-exclusions/1.1.0',\
    chain"
    SecRule &TX:vaultwarden-rule-exclusions-plugin_other_file "@eq 0" \
        "t:none,\
        ctl:ruleRemoveTargetById=920120;FILES,\
        ctl:ruleRemoveTargetById=920121;FILES,\
        ctl:ruleRemoveTargetById=932180;FILES"

# A device's name is free text, "Pixel 8 Pro" say, which the byte range
# check at paranoia 4 refuses for its spaces. Every other rule still reads it.
SecRule REQUEST_FILENAME "@streq /identity/connect/token" \
    "id:20130,\
    phase:1,\
    pass,\
    t:none,\
    nolog,\
    ver:'vaultwarden-rule-exclusions/1.1.0',\
    ctl:ruleRemoveTargetById=920273;ARGS:devicename"

# So are an account's name and its master password hint.
SecRule REQUEST_FILENAME "@streq /api/accounts/profile" \
    "id:20140,\
    phase:1,\
    pass,\
    t:none,\
    nolog,\
    ver:'vaultwarden-rule-exclusions/1.1.0',\
    ctl:ruleRemoveTargetById=920273;ARGS:json.name,\
    ctl:ruleRemoveTargetById=920273;ARGS:json.masterpasswordhint"

# An import and a key rotation send the whole vault at once, more arguments
# than the thousand the WAF reads, and a body with more is refused (Ostiole's
# rule 10007). Here the rest go unread instead: both take a signed-in
# client. Key rotation's own fields are still read as CRS reads them.
SecRule REQUEST_FILENAME "@rx ^/api/(?:ciphers/import(?:-organization)?|accounts/key-management/rotate-user-account-keys)$" \
    "id:20150,\
    phase:1,\
    pass,\
    t:none,\
    nolog,\
    ver:'vaultwarden-rule-exclusions/1.1.0',\
    ctl:ruleRemoveById=10007"
