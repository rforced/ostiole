# Ostiole's Vaultwarden rule exclusions, 1.0.0. Rules are in
# vaultwarden-before.conf.
#
# Rule ID block: 20,000 - 20,999
#
# On unless tx.vaultwarden-rule-exclusions-plugin_enabled is set to 0 first.
SecRule &TX:vaultwarden-rule-exclusions-plugin_enabled "@eq 0" \
    "id:20010,\
    phase:1,\
    pass,\
    nolog,\
    ver:'vaultwarden-rule-exclusions/1.0.0',\
    setvar:'tx.vaultwarden-rule-exclusions-plugin_enabled=1'"
