# Ostiole's Tendrils rule exclusions, 1.0.0. Rules are in
# tendrils-before.conf.
#
# Rule ID block: 22,000 - 22,999
#
# On unless tx.tendrils-rule-exclusions-plugin_enabled is set to 0 first.
SecRule &TX:tendrils-rule-exclusions-plugin_enabled "@eq 0" \
    "id:22010,\
    phase:1,\
    pass,\
    nolog,\
    ver:'tendrils-rule-exclusions/1.0.0',\
    setvar:'tx.tendrils-rule-exclusions-plugin_enabled=1'"
